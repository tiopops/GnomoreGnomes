<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo marcos de perfil — Gnomore Gnomes</title>
<style>
  @font-face { font-family: "Russo One"; src: url("../assets/fonts/RussoOne-Regular.woff2") format("woff2"); font-weight: 400; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #1c1824; color: #fff; font-family: "Russo One", system-ui, sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; background: rgba(12, 8, 18, .78); z-index: -1; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 22px 16px 60px; display: grid; gap: 22px; }
  h1 { margin: 0; font-size: 1.2rem; text-shadow: 2px 2px 0 #000; }
  h1 small { display: block; font-size: .9rem; color: #e9e2f7; margin-top: 4px; font-weight: 400; }
  .panel { position: relative; isolation: isolate; padding: 26px 22px; filter: drop-shadow(5px 5px 0 rgba(0,0,0,.6)); }
  .panel::before, .panel::after { content: ""; position: absolute; z-index: -1; clip-path: polygon(1.5% 0, 100% 1.5%, 98.5% 100%, 0 98.5%); }
  .panel::before { inset: 0; background: #8f7bb8; }
  .panel::after { inset: 5px; background: linear-gradient(100deg, #4b3a66, #2c2435); }
  .tt { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; text-shadow: 2px 2px 0 #000; margin-bottom: 14px; }

  /* ---------- Retrato + marco ---------- */
  .pic { --sz: 130px; margin: 0; position: relative; width: var(--sz); height: var(--sz); flex: none; isolation: isolate; }
  .pic .fr { position: absolute; inset: -9px; z-index: 0; pointer-events: none; }
  .pic .fr > i { position: absolute; display: block; }
  .pic .face { position: absolute; inset: 0; z-index: 1; overflow: hidden; clip-path: polygon(4% 0, 100% 3%, 96% 100%, 0 97%); background: #4b3a66; }
  .pic .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: translate(var(--tx), var(--ty)) scale(var(--s)); }
  .pic .lv { position: absolute; right: -6px; bottom: -4px; z-index: 3; width: 34px; height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; color: #111; isolation: isolate; filter: drop-shadow(2px 2px 0 rgba(0,0,0,.7)); }
  .pic .lv::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #000; clip-path: polygon(10% 3%, 95% 0, 100% 87%, 5% 100%); }
  .pic .lv::after { content: ""; position: absolute; inset: 3px; z-index: -1; background: #ffcf3d; clip-path: polygon(10% 3%, 95% 0, 100% 87%, 5% 100%); }
  .pic .lv small { font-size: .42rem; opacity: .75; } .pic .lv b { font-size: 1rem; font-weight: 400; }

  /* Marco = ilustración SVG (contorno negro grueso, colores planos) con un hueco para la cara */
  .pic .fr { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: visible; }
  .pic .fr svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(3px 3px 0 rgba(0,0,0,.6)); }
  .pic .face { inset: 4px; clip-path: none; background: #2c2435; }
  .pic .face img { transform: translate(var(--tx), var(--ty)) scale(var(--s)); }
  .pic .face { inset: 20%; }

  /* ---------- Perfil ---------- */
  .hero { display: flex; gap: 30px; align-items: center; padding: 16px 12px 10px 18px; }
  .nick { font-size: 1.5rem; text-shadow: 2px 2px 0 #000; }
  .tit { color: #f0c850; font-size: .95rem; margin-top: 4px; text-shadow: 2px 2px 0 #000; }
  .mail { color: #cfc4e8; font-size: .9rem; margin-top: 6px; }

  /* ---------- Selector de marcos ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px 10px; padding: 14px 6px 6px; }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 14px; cursor: pointer; background: none; border: 0; color: inherit; font: inherit; padding: 8px 4px; outline: none; }
  .opt .pic { --sz: 100px; transition: transform .15s; }
  .opt:hover .pic, .opt:focus-visible .pic { transform: rotate(-2deg) scale(1.06); }
  .opt b { font-weight: 400; font-size: .9rem; text-shadow: 2px 2px 0 #000; text-align: center; }
  .opt.sel b { color: #f0c850; }
  .opt.lock .face { filter: grayscale(1) brightness(.8); }
  .lockb { position: absolute; right: 4px; bottom: 4px; z-index: 4; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; isolation: isolate; filter: drop-shadow(2px 2px 0 rgba(0,0,0,.6)); font-size: .8rem; }
  .lockb::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #000; clip-path: polygon(10% 3%, 95% 0, 100% 87%, 5% 100%); }
  .lockb::after { content: ""; position: absolute; inset: 2px; z-index: -1; background: #6b5c86; clip-path: polygon(10% 3%, 95% 0, 100% 87%, 5% 100%); }
  .info { min-height: 52px; text-align: center; display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
  .info b { font-weight: 400; color: #f0c850; text-shadow: 2px 2px 0 #000; font-size: 1.1rem; }
  .info span { color: #e9e2f7; font-size: .95rem; }

  /* ---------- Lobby y final ---------- */
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 22px 8px 14px; background: rgba(0,0,0,.28); }
  .slot .nm { font-size: 1.05rem; text-shadow: 2px 2px 0 #000; }
  .slot .rc { font-size: .9rem; color: #cfc4e8; }
  .res { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 12px; }
  .res .side { display: flex; align-items: center; gap: 16px; font-size: 1.05rem; text-shadow: 2px 2px 0 #000; }
  .res .side.r { flex-direction: row-reverse; text-align: right; }
  .res .vs { font-size: 1.4rem; color: #f0c850; text-shadow: 2px 2px 0 #000; }
  @media (max-width: 640px) { .hero { flex-direction: column; text-align: center; } .duo { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Marcos de perfil<small>Demo con los sprites reales. Pulsa un marco para ponértelo y mira cómo queda en el perfil, el lobby online y el resultado.</small></h1>

  <div class="panel"><div class="tt">Mi cuenta</div>
    <div class="hero" id="hero"></div>
  </div>

  <div class="panel"><div class="tt">Marco de perfil</div>
    <div class="grid" id="grid"></div>
    <div class="info" id="info"></div>
  </div>

  <div class="panel"><div class="tt">Lobby online</div>
    <div class="duo"><div class="slot" id="s1"></div><div class="slot" id="s2"></div></div>
  </div>

  <div class="panel"><div class="tt">Resultado</div>
    <div class="res" id="res"></div>
  </div>
</div>
<script>
  const P = {
    gnomo: { img: "../assets/equipos/MushboomForest/gnomo_idle.png", c: [-8, 23.4, 1.8], name: "Gnomo" },
    traza: { img: "../assets/equipos/EquipoEnmurallado/unidad_02.png", c: [-5.9, 18.8, 2], name: "TrazaFlechas" },
  };
  // ---------- Marcos: ilustraciones SVG (viewBox 120; hueco de la cara 24..96) ----------
  const K = 'stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
  const HOLE = "M25 27 Q24 24 28 24 L93 25 Q96 25 96 29 L95 93 Q95 96 91 96 L27 95 Q24 95 24 91 Z";
  const ring = (outer, fill) => `<path d="${outer} ${HOLE}" fill="${fill}" fill-rule="evenodd" ${K}/>`;
  const rivet = (x, y, c = "#d8dee8", r = 3) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${K} stroke-width="2"/>`;
  const leaf = (x, y, rot, c = "#6fae3a") => `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0 Q10 -12 24 -6 Q14 8 0 0Z" fill="${c}" ${K}/><path d="M2 -1 Q12 -4 20 -5" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></g>`;
  const OUT = "M6 10 Q4 4 11 5 L112 4 Q117 4 116 10 L115 111 Q116 117 110 116 L9 115 Q4 115 5 109 Z";
  const grain = (c) => `<g fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"><path d="M14 22 Q40 18 70 22"/><path d="M52 12 Q80 9 104 13"/><path d="M12 100 Q40 106 66 101"/><path d="M62 108 Q86 111 106 106"/><path d="M11 40 Q9 60 12 84"/><path d="M108 36 Q111 62 107 86"/></g>`;
  const FR = {
    none: `<path d="M20 22 Q20 20 23 20 L98 21 Q101 21 100 25 L99 97 Q99 100 95 100 L24 99 Q21 99 21 96 Z M25 27 L25 91 Q25 95 29 95 L91 95 Q95 95 95 91 L95 29 Q95 25 91 25 Z" fill="#000" fill-rule="evenodd"/>`,
    madera: ring(OUT, "#b06f3c") + grain("#7b4a26") + rivet(15, 15, "#e8dcb8") + rivet(105, 15, "#e8dcb8") + rivet(15, 105, "#e8dcb8") + rivet(105, 105, "#e8dcb8")
      + `<ellipse cx="60" cy="11" rx="5" ry="3.2" fill="#7b4a26" ${K} stroke-width="2"/><ellipse cx="11" cy="62" rx="3.2" ry="5" fill="#7b4a26" ${K} stroke-width="2"/>`,
    piedra: ring(OUT, "#9aa0ad")
      + `<g fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"><path d="M38 5 L36 24"/><path d="M80 4 L82 24"/><path d="M38 116 L40 96"/><path d="M82 115 L80 96"/><path d="M5 40 L24 42"/><path d="M5 80 L24 78"/><path d="M116 40 L96 42"/><path d="M116 82 L96 80"/></g>`
      + `<g fill="#c3c8d3"><path d="M12 12 L30 11 L28 17 L13 18Z"/><path d="M88 10 L108 11 L107 17 L90 16Z"/><path d="M12 100 L26 102 L25 108 L12 107Z"/></g>`
      + `<path d="M6 12 Q18 6 30 10 Q34 18 26 20 Q22 28 14 24 Q6 22 6 12Z" fill="#5f9a3a" ${K}/><path d="M92 108 Q104 100 116 106 Q118 114 108 116 Q98 118 92 108Z" fill="#5f9a3a" ${K}/>`
      + `<path d="M70 8 L66 14 L72 17 L68 22" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>`,
    metal: ring("M14 4 L106 4 L116 14 L116 106 L106 116 L14 116 L4 106 L4 14 Z", "#7f8ea3")
      + `<path d="M14 11 L106 11 L109 14 M109 106 L106 109 L14 109 L11 106 M11 14 L11 106" fill="none" stroke="#b9c6d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`
      + `<g fill="none" stroke="#000" stroke-width="2.2"><path d="M60 4 L60 24"/><path d="M60 116 L60 96"/><path d="M4 60 L24 60"/><path d="M116 60 L96 60"/></g>`
      + [[14,14],[106,14],[14,106],[106,106],[60,13],[60,107],[13,60],[107,60]].map(([x,y])=>rivet(x,y,"#e6ecf5",3.2)).join("")
      + `<path d="M96 4 L116 4 L116 24 Z" fill="#f2b632" ${K} stroke-width="2.4"/>`,
    bosque: ring(OUT, "#a8693a") + grain("#7b4a26")
      + `<g><path d="M4 22 Q6 -4 34 4 Q48 8 44 22 Q24 26 4 22Z" fill="#d93a3a" ${K}/><circle cx="16" cy="12" r="3.6" fill="#fff" ${K} stroke-width="2"/><circle cx="29" cy="9" r="4.4" fill="#fff" ${K} stroke-width="2"/><circle cx="36" cy="17" r="2.8" fill="#fff" ${K} stroke-width="2"/><path d="M10 22 Q24 28 40 22 L38 28 Q24 32 12 28Z" fill="#f4e3c2" ${K} stroke-width="2.4"/></g>`
      + `<g><path d="M86 112 Q88 96 106 100 Q118 103 116 112 Q100 118 86 112Z" fill="#f08a2e" ${K}/><circle cx="98" cy="105" r="2.6" fill="#fff" ${K} stroke-width="1.8"/><circle cx="108" cy="108" r="2.2" fill="#fff" ${K} stroke-width="1.8"/></g>`
      + leaf(88, 8, -10) + leaf(4, 96, -70, "#4f8f2e"),
    libro: ring("M5 8 Q5 4 10 4 L110 4 Q116 4 116 10 L116 110 Q116 116 110 116 L10 116 Q4 116 5 110 Z", "#5a4480")
      + `<path d="M12 12 L108 12 L108 108 L12 108 Z M24 24 L24 96 L96 96 L96 24Z" fill="none" stroke="#f0c850" stroke-width="2.6" stroke-linejoin="round" fill-rule="evenodd"/>`
      + [[5,4,24,0,0,24],[116,4,-24,0,0,24],[5,116,24,0,0,-24],[116,116,-24,0,0,-24]].map(([x,y,dx,_a,_b,dy])=>`<path d="M${x} ${y} L${x+dx} ${y} L${x} ${y+dy} Z" fill="#f0c850" ${K}/>`).join("")
      + `<path d="M84 4 L84 34 L92 27 L100 34 L100 4Z" fill="#c8352f" ${K}/>`
      + `<path d="M60 8 L63 14 L69 14 L64 18 L66 24 L60 20 L54 24 L56 18 L51 14 L57 14Z" fill="#f0c850" ${K} stroke-width="2"/>`,
    brasas: ring(OUT, "#3b2a2c")
      + `<g fill="none" stroke="#ff8a2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 40 L18 46 L12 56 L19 66"/><path d="M110 50 L102 58 L109 68 L103 80"/><path d="M30 111 L38 105 L48 111 L58 106"/><path d="M70 10 L78 14 L86 9"/></g>`
      + `<path d="M8 20 Q8 8 16 4 Q15 12 20 14 Q22 4 30 0 Q30 10 36 12 Q42 8 44 14 Q40 24 28 24 L12 24Z" fill="#e36a2e" ${K}/><path d="M18 22 Q18 14 24 10 Q26 16 30 18 Q32 22 28 22Z" fill="#ffcf3f"/>`
      + `<path d="M74 22 Q72 10 80 6 Q80 12 85 13 Q88 4 96 2 Q95 12 102 14 Q108 12 110 18 Q106 24 94 24 L78 24Z" fill="#e36a2e" ${K}/><path d="M84 22 Q84 15 90 12 Q92 17 95 19 Q94 22 92 22Z" fill="#ffcf3f"/>`
      + rivet(14, 106, "#6a5658", 2.8) + rivet(106, 106, "#6a5658", 2.8),
    muralla: `<path d="M6 30 L6 8 L22 8 L22 16 L34 16 L34 8 L52 8 L52 16 L68 16 L68 8 L86 8 L86 16 L98 16 L98 8 L114 8 L114 30 L114 110 Q114 116 108 116 L12 116 Q6 116 6 110 Z ${HOLE}" fill="#98a0ad" fill-rule="evenodd" ${K}/>`
      + `<g fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><path d="M6 30 L24 30"/><path d="M96 30 L114 30"/><path d="M40 8 L40 16"/><path d="M77 8 L77 16"/><path d="M5 60 L24 62"/><path d="M114 58 L96 60"/><path d="M30 116 L32 96"/><path d="M90 116 L88 96"/></g>`
      + `<path d="M10 46 L16 46 L16 62 L10 62Z M104 46 L110 46 L110 62 L104 62Z" fill="#2c2435" ${K} stroke-width="2"/>`
      + `<path d="M96 -6 L96 14" stroke="#000" stroke-width="3.4" stroke-linecap="round"/><path d="M97 -5 L118 -1 L110 5 L118 11 L97 12Z" fill="#2f9fa8" ${K} stroke-width="2.4"/>`
      + `<path d="M8 16 L20 16" stroke="#c4cad5" stroke-width="3" stroke-linecap="round"/><path d="M54 16 L66 16" stroke="#c4cad5" stroke-width="3" stroke-linecap="round"/>`,
  };
  const FRAMES = [
    { id: "none", n: "Sin marco", how: "", own: true },
    { id: "madera", n: "Madera", how: "Llega al nivel 10.", own: true },
    { id: "piedra", n: "Piedra", how: "Llega al nivel 25.", own: false },
    { id: "metal", n: "Metal", how: "Llega al nivel 50.", own: false },
    { id: "bosque", n: "Bosque Mushboom", how: "Gana 10 partidas con el equipo Mushboom Forest.", own: false },
    { id: "libro", n: "Sabio de Nizak", how: "Completa la Gnomoteca al 100%.", own: false },
    { id: "brasas", n: "Racha ardiente", how: "Juega 7 días seguidos.", own: false },
    { id: "muralla", n: "Muralla de temporada", how: "Termina la temporada 1 con rango de plata o más. Ya no se podrá conseguir luego.", own: false },
  ];
  let sel = "madera";
  const pic = (p, fr, sz, lv, lock) => {
    const c = p.c;
    return `<div class="pic" style="--sz:${sz}px;--tx:${c[0]}%;--ty:${c[1]}%;--s:${c[2]}">
      <div class="face"><img src="${p.img}" alt="" draggable="false"></div>
      <div class="fr"><svg viewBox="0 0 120 120">${FR[fr]}</svg></div>
      ${lv ? `<span class="lv"><small>NIV</small><b>${lv}</b></span>` : ""}${lock ? '<span class="lockb"><svg width="14" height="14" viewBox="0 0 256 256" fill="#fff"><path d="M208 80h-32V56a48 48 0 0 0-96 0v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16ZM96 56a32 32 0 0 1 64 0v24H96Z"/></svg></span>' : ""}</div>`;
  };
  function draw() {
    document.getElementById("hero").innerHTML = `${pic(P.gnomo, sel, 140, 12)}<div><div class="nick">Jesús</div><div class="tit">Aplastagnomos</div><div class="mail">tu@correo.com</div></div>`;
    document.getElementById("grid").innerHTML = FRAMES.map((f) => `<button class="opt ${f.id === sel ? "sel" : ""} ${f.own ? "" : "lock"}" data-id="${f.id}">${pic(P.gnomo, f.id, 100, 0, !f.own)}<b>${f.n}</b></button>`).join("");
    const f = FRAMES.find((x) => x.id === sel);
    document.getElementById("info").innerHTML = `<b>${f.n}</b><span>${f.own ? "Desbloqueado" : f.how}</span>`;
    document.getElementById("s1").innerHTML = `${pic(P.gnomo, sel, 130)}<div class="nm">Jesús</div><div class="rc">Mushboom Forest</div>`;
    document.getElementById("s2").innerHTML = `${pic(P.traza, "metal", 130)}<div class="nm">Rival_22</div><div class="rc">Equipo Enmurallado</div>`;
    document.getElementById("res").innerHTML = `<div class="side">${pic(P.gnomo, sel, 84)}<span>Jesús</span></div><div class="vs">VS</div><div class="side r">${pic(P.traza, "metal", 84)}<span>Rival_22</span></div>`;
    document.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
      const fr = FRAMES.find((x) => x.id === b.dataset.id);
      if (!fr.own) { sel = fr.id; draw(); return; }
      sel = fr.id; draw();
    }));
  }
  draw();
</script>
</body>
</html>
