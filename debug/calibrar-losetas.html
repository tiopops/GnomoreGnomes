<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calibrar losetas — Gnomore Gnomes</title>
<style>
  :root {
    --bg: #1f2430;
    --bg-elevated: #262c3a;
    --accent: #7a3ef0;
    --ink: #f4f2f8;
    --muted: #a9a6b8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  .panel {
    padding: 16px 20px;
    background: var(--bg-elevated);
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: center;
    border-bottom: 1px solid #3a4054;
  }
  .control { display: flex; flex-direction: column; gap: 4px; min-width: 260px; }
  .control label { font-size: 0.85rem; color: var(--muted); }
  .control .value { font-weight: 700; color: var(--accent); font-size: 1.1rem; }
  input[type="range"] { width: 100%; }
  .hint { font-size: 0.8rem; color: var(--muted); max-width: 480px; }

  .board-wrap {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .board-tiles { position: relative; }
  .tile { position: absolute; line-height: 0; }
  .tile img { display: block; user-select: none; -webkit-user-drag: none; }
</style>
</head>
<body>

  <div class="panel">
    <div class="control">
      <label for="topHeight">Alineación vertical (alto de la cara superior) — <span class="value" id="topHeightVal">86</span> px</label>
      <input type="range" id="topHeight" min="0" max="260" step="1" value="86">
      <span class="hint">Mueve el slider hasta que las losetas encajen en vertical sin huecos ni solapes en el borde de tierra. Luego dime el número que te sale.</span>
    </div>
    <div class="control">
      <label for="tileWidth">Alineación horizontal (ancho de loseta) — <span class="value" id="tileWidthVal">250</span> px</label>
      <input type="range" id="tileWidth" min="50" max="420" step="1" value="250">
      <span class="hint">Solo tócalo si también ves huecos o solapes en horizontal.</span>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board-tiles" id="board-tiles"></div>
  </div>

  <script>
    const TILE_IMG = "../assets/losetas/hierba_01.png";
    const TILE_IMG_WIDTH = 250;   // ancho real del archivo (fijo, no cambia)
    const TILE_IMG_HEIGHT = 217;  // alto real del archivo (fijo, no cambia)
    const GRID_SIZE = 6;

    const topHeightInput = document.getElementById("topHeight");
    const tileWidthInput = document.getElementById("tileWidth");
    const topHeightVal = document.getElementById("topHeightVal");
    const tileWidthVal = document.getElementById("tileWidthVal");
    const container = document.getElementById("board-tiles");

    function render() {
      const topHeight = Number(topHeightInput.value);
      const tileWidth = Number(tileWidthInput.value);
      topHeightVal.textContent = topHeight;
      tileWidthVal.textContent = tileWidth;

      container.innerHTML = "";
      const halfW = tileWidth / 2;
      const halfH = topHeight / 2;
      const centerX = (GRID_SIZE - 1) * halfW;

      const boardWidth = GRID_SIZE * tileWidth;
      const boardHeight = GRID_SIZE * topHeight + (TILE_IMG_HEIGHT - topHeight);
      container.style.width = boardWidth + "px";
      container.style.height = boardHeight + "px";

      const fragment = document.createDocumentFragment();
      for (let row = 0; row < GRID_SIZE; row++) {
        for (let col = 0; col < GRID_SIZE; col++) {
          const el = document.createElement("div");
          el.className = "tile";
          const img = document.createElement("img");
          img.src = TILE_IMG;
          img.width = tileWidth;
          img.height = tileWidth * (TILE_IMG_HEIGHT / TILE_IMG_WIDTH);
          img.draggable = false;
          img.alt = "";
          el.appendChild(img);

          const x = (col - row) * halfW + centerX;
          const y = (col + row) * halfH;
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.style.zIndex = String(row + col);
          fragment.appendChild(el);
        }
      }
      container.appendChild(fragment);
    }

    topHeightInput.addEventListener("input", render);
    tileWidthInput.addEventListener("input", render);
    render();
  </script>
</body>
</html>
