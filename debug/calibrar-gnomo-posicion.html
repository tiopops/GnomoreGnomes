<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calibrar posición del gnomo cogido — Gnomore Gnomes</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* Estilos propios de esta herramienta — el resto (.unit, .unit__flip,
     .unit__sprite, .gnome-attach...) viene tal cual del CSS real del juego
     (ver el <link> de arriba) para que la vista previa sea pixel a pixel
     igual que en la partida, no una aproximación. */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .panel {
    padding: 16px 20px;
    background: var(--bg-elevated);
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: flex-end;
    border-bottom: 1px solid #3a4054;
  }
  .control { display: flex; flex-direction: column; gap: 4px; min-width: 240px; }
  .control label { font-size: 0.85rem; color: var(--muted); }
  .control .value { font-weight: 700; color: var(--accent); font-size: 1.05rem; }
  input[type="range"] { width: 100%; }
  select {
    background: var(--bg);
    color: var(--ink);
    border: 1px solid rgba(244, 242, 248, 0.3);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.95rem;
  }
  .hint { font-size: 0.78rem; color: var(--muted); max-width: 320px; }
  .toggle-btn {
    background: var(--bg);
    color: var(--ink);
    border: 1px solid rgba(244, 242, 248, 0.3);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .toggle-btn:hover { background: var(--accent); border-color: var(--accent-hover); }
  .reset-btn {
    background: transparent;
    color: #ff8a8a;
    border: 1px solid rgba(255, 138, 138, 0.4);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .reset-btn:hover { background: rgba(255, 138, 138, 0.12); }

  .stage-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 320px;
    background:
      linear-gradient(rgba(244,242,248,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(244,242,248,0.05) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .stage {
    position: relative;
    width: 320px;
    height: 320px;
  }
  /* Reposiciona al personaje/gnomo en el centro del escenario de pruebas en
     vez de en su sitio real sobre una loseta isométrica — aquí no hace
     falta tablero, solo ver el personaje y el gnomo pegado a él. */
  .stage .unit {
    left: 50%;
    top: 78%;
  }
  .stage .unit__hpbar { display: none; }

  .output-wrap {
    padding: 14px 20px 20px;
    background: var(--bg-elevated);
    border-top: 1px solid #3a4054;
  }
  .output-wrap h2 { font-size: 0.95rem; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  textarea {
    width: 100%;
    min-height: 150px;
    background: var(--bg);
    color: #b7f5c2;
    border: 1px solid rgba(244, 242, 248, 0.2);
    border-radius: 10px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.85rem;
    padding: 12px;
    resize: vertical;
  }
  .output-actions { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
  .copied-msg { color: #5fe083; font-size: 0.85rem; opacity: 0; transition: opacity 0.2s ease; }
  .copied-msg--visible { opacity: 1; }
</style>
</head>
<body>

  <div class="panel">
    <div class="control">
      <label for="charSelect">Personaje</label>
      <select id="charSelect"></select>
      <span class="hint">La lista sale directamente de UNIT_TYPES (js/units.js): cualquier personaje nuevo que añadas al juego aparece aquí solo, sin tocar esta herramienta.</span>
    </div>
    <div class="control">
      <label for="right">Desplazamiento horizontal (right) — <span class="value" id="rightVal">-14</span> px</label>
      <input type="range" id="right" min="-80" max="80" step="1" value="-14">
    </div>
    <div class="control">
      <label for="bottom">Desplazamiento vertical (bottom) — <span class="value" id="bottomVal">6</span> %</label>
      <input type="range" id="bottom" min="-20" max="100" step="1" value="6">
    </div>
    <div class="control">
      <label for="width">Tamaño del gnomo cogido — <span class="value" id="widthVal">46</span> px</label>
      <input type="range" id="width" min="20" max="100" step="1" value="46">
    </div>
    <div class="control" style="min-width: auto;">
      <button class="toggle-btn" id="flipBtn">Girar personaje</button>
    </div>
    <div class="control" style="min-width: auto;">
      <button class="reset-btn" id="resetBtn">Reiniciar este personaje</button>
    </div>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage"></div>
  </div>

  <div class="output-wrap">
    <h2>GNOME_ATTACH_OFFSETS (todos los personajes calibrados en este navegador) — cópialo y pásamelo para que lo aplique en js/gnome.js</h2>
    <textarea id="output" readonly></textarea>
    <div class="output-actions">
      <button class="toggle-btn" id="copyBtn">Copiar</button>
      <span class="copied-msg" id="copiedMsg">Copiado ✓</span>
    </div>
  </div>

  <script src="../js/units.js"></script>
  <script>
    const STORAGE_KEY = "gnomore-gnomo-posicion-v1";
    const DEFAULTS = { right: -14, bottom: 6, width: 46 };

    function loadAll() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (e) {
        return {};
      }
    }
    function saveAll(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        // almacenamiento no disponible — no es crítico, solo se pierde la persistencia entre recargas
      }
    }

    let tuned = loadAll();
    let facingLeft = false;

    const charSelect = document.getElementById("charSelect");
    const rightInput = document.getElementById("right");
    const bottomInput = document.getElementById("bottom");
    const widthInput = document.getElementById("width");
    const rightVal = document.getElementById("rightVal");
    const bottomVal = document.getElementById("bottomVal");
    const widthVal = document.getElementById("widthVal");
    const flipBtn = document.getElementById("flipBtn");
    const resetBtn = document.getElementById("resetBtn");
    const stage = document.getElementById("stage");
    const output = document.getElementById("output");
    const copyBtn = document.getElementById("copyBtn");
    const copiedMsg = document.getElementById("copiedMsg");

    Object.keys(UNIT_TYPES).forEach((typeId) => {
      const opt = document.createElement("option");
      opt.value = typeId;
      opt.textContent = UNIT_TYPES[typeId].name;
      charSelect.appendChild(opt);
    });

    let currentEls = null;

    function buildStage(typeId) {
      stage.innerHTML = "";
      const type = UNIT_TYPES[typeId];

      const el = document.createElement("div");
      el.className = "unit unit--player";
      const flipEl = document.createElement("div");
      flipEl.className = "unit__flip";
      const spriteEl = document.createElement("img");
      spriteEl.className = "unit__sprite";
      spriteEl.src = "../" + type.spriteUrl;
      spriteEl.draggable = false;
      spriteEl.alt = "";
      if (type.spriteScale && type.spriteScale !== 1) {
        spriteEl.style.width = Math.round(120 * type.spriteScale) + "px";
      }
      flipEl.appendChild(spriteEl);
      el.appendChild(flipEl);
      stage.appendChild(el);

      const attachEl = document.createElement("div");
      attachEl.className = "gnome-attach gnome-attach--visible";
      const attachSprite = document.createElement("img");
      attachSprite.className = "gnome-attach__sprite";
      attachSprite.src = "../assets/equipos/MushboomForest/gnomo_grita.png";
      attachSprite.draggable = false;
      attachSprite.alt = "";
      attachEl.appendChild(attachSprite);
      flipEl.appendChild(attachEl);

      currentEls = { el, flipEl, attachEl };
      applyFacing();
    }

    function applyFacing() {
      if (!currentEls) return;
      currentEls.flipEl.style.transform = facingLeft ? "scaleX(-1)" : "scaleX(1)";
    }

    function currentValues() {
      return {
        right: Number(rightInput.value),
        bottom: Number(bottomInput.value),
        width: Number(widthInput.value),
      };
    }

    function applyValuesToStage() {
      if (!currentEls) return;
      const v = currentValues();
      currentEls.attachEl.style.right = v.right + "px";
      currentEls.attachEl.style.bottom = v.bottom + "%";
      currentEls.attachEl.style.width = v.width + "px";
      rightVal.textContent = v.right;
      bottomVal.textContent = v.bottom;
      widthVal.textContent = v.width;
    }

    function updateOutput() {
      const lines = ["const GNOME_ATTACH_OFFSETS = {", `  default: { right: ${DEFAULTS.right}, bottom: ${DEFAULTS.bottom}, width: ${DEFAULTS.width} },`];
      Object.keys(UNIT_TYPES).forEach((typeId) => {
        const v = tuned[typeId] || DEFAULTS;
        lines.push(`  ${typeId}: { right: ${v.right}, bottom: ${v.bottom}, width: ${v.width} },`);
      });
      lines.push("};");
      output.value = lines.join("\n");
    }

    function persistCurrent() {
      const typeId = charSelect.value;
      tuned[typeId] = currentValues();
      saveAll(tuned);
      updateOutput();
    }

    function loadCharacter(typeId) {
      const v = tuned[typeId] || DEFAULTS;
      rightInput.value = v.right;
      bottomInput.value = v.bottom;
      widthInput.value = v.width;
      buildStage(typeId);
      applyValuesToStage();
    }

    charSelect.addEventListener("change", () => loadCharacter(charSelect.value));

    [rightInput, bottomInput, widthInput].forEach((input) => {
      input.addEventListener("input", () => {
        applyValuesToStage();
        persistCurrent();
      });
    });

    flipBtn.addEventListener("click", () => {
      facingLeft = !facingLeft;
      applyFacing();
    });

    resetBtn.addEventListener("click", () => {
      const typeId = charSelect.value;
      delete tuned[typeId];
      saveAll(tuned);
      loadCharacter(typeId);
      updateOutput();
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(output.value);
      } catch (e) {
        output.select();
        document.execCommand("copy");
      }
      copiedMsg.classList.add("copied-msg--visible");
      setTimeout(() => copiedMsg.classList.remove("copied-msg--visible"), 1400);
    });

    loadCharacter(charSelect.value);
    updateOutput();
  </script>
</body>
</html>
