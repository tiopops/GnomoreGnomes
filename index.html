<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- maximum-scale=1, user-scalable=no: refuerza el touch-action:manipulation de
     style.css (ver esa nota) — sin esto, el navegador puede seguir esperando
     un posible doble-toque-zoom en pantallas fuera del tablero (menús,
     selección de modo/raza...), donde el pan/pinch a mano de boardview.js no
     existe para tomar el control del gesto. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gnomore Gnomes</title>
<link rel="stylesheet" href="css/style.css?v=1791310000">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script>
  // Pedido explícito: "en la interfaz del smartphone, a veces tengo que
  // hacer doble clic para seleccionar unidades o acciones...debe ser de
  // una" — bug documentado de Safari/Chrome en iOS: cualquier elemento con
  // estilos ":hover" y un manejador de clic necesita un PRIMER toque solo
  // para "simular" el hover y un SEGUNDO toque de verdad para el clic, en
  // cuanto la página no tiene ningún listener de touchstart registrado en
  // absoluto. Añadir uno (aunque no haga nada) cambia esa heurística del
  // navegador y hace que cada toque cuente como un clic de una sola vez —
  // arreglo mínimo, sin tocar ningún :hover de los cientos que ya hay en
  // style.css. Debe registrarse ANTES de cualquier interacción, así que va
  // aquí arriba, no en un archivo cargado más tarde.
  document.addEventListener("touchstart", function () {}, { passive: true });
</script>
</head>
<body>

  <!-- Menú principal -->
  <main class="screen screen--active main-menu" id="main-menu">
    <!-- Pedido explícito: "en el menu principal aparece una especie de
         poligono arriba de los botones, quiero que lo elimines y pongas el
         logotipo que te paso". El logotipo real YA incluye el nombre del
         juego dibujado como parte de la ilustración, así que el título de
         texto (<h1>, el "banderín" que ponía "GNOMORE GNOMES" debajo del
         hexágono) se retira también — mantenerlo habría repetido el mismo
         texto dos veces seguidas. game_title (i18n) se queda en STRINGS
         (js/i18n.js) sin usar aquí por si hiciera falta en otra pantalla. -->
    <!-- Pedido explícito (pasada posterior): "puedes hacer que el clic solo
         tenga efecto sobre la zona donde esta el gnomo en el logo y no sobre
         todo el logo?" — el logotipo es una única imagen plana (no hay un
         recorte de gnomo aparte), así que la zona pulsable se simula con un
         <button> invisible superpuesto, posicionado en % sobre la ilustración
         (mismo criterio de "envoltorio position:relative + hijo absoluto en
         %" que el resto del proyecto para que escale junto con el logo sea
         cual sea su tamaño real en pantalla). Ver .main-logo-hit en
         style.css para las coordenadas exactas y js/menu.js para el clic. -->
    <div class="main-logo-wrap">
      <img class="main-logo" src="assets/ui/logo_principal.png?v=20261003105937" alt="Gnomore Gnomes" />
      <button type="button" class="main-logo-hit" aria-label="Gnomo"></button>
    </div>
    <h1 class="sr-only"><span data-i18n="game_title">Gnomore Gnomes</span></h1>

    <nav class="menu-buttons">
      <button id="btn-new-game" class="menu-btn">
        <i class="ph ph-plus-circle"></i>
        <span data-i18n="menu_new_game">Partida Rápida</span>
      </button>
      <button id="btn-tutorial" class="menu-btn">
        <i class="ph ph-graduation-cap"></i>
        <span data-i18n="menu_tutorial">Tutorial</span>
      </button>
      <button id="btn-resume-game" class="menu-btn" disabled>
        <i class="ph ph-arrow-clockwise"></i>
        <span data-i18n="menu_resume_game">Reanudar Partida</span>
      </button>
      <button id="btn-multiplayer" class="menu-btn">
        <i class="ph ph-users"></i>
        <span data-i18n="menu_multiplayer">Multijugador</span>
      </button>
    </nav>

    <p class="menu-footer" data-i18n="menu_footer">Prototipo en construcción</p>
  </main>

  <!-- Selección de modo de juego -->
  <main class="screen" id="screen-mode-select">
    <button class="back-btn" data-back><i class="ph ph-arrow-left"></i> <span data-i18n="back">Volver</span></button>
    <h2 data-i18n="choose_mode">Elige el modo de juego</h2>
    <div class="option-list" id="mode-list"></div>
  </main>

  <!-- Selección de raza -->
  <main class="screen" id="screen-race-select">
    <button class="back-btn" data-back><i class="ph ph-arrow-left"></i> <span data-i18n="back">Volver</span></button>
    <h2 data-i18n="choose_race">Elige tu raza</h2>
    <!-- Pedido explícito (segunda pasada): "queria CARTAS!!! formato carta
         de juego de rol" — contenedor propio (no .option-list, pensado
         para la lista vertical y estrecha de modo/rivales) para las
         tarjetas de raza, más anchas y en fila (ver .race-card-list en
         css/style.css y renderRaceCard en js/newgame-flow.js). -->
    <div class="race-card-list" id="race-list"></div>
  </main>

  <!-- Selección de nivel (fase): después de elegir raza -->
  <main class="screen" id="screen-level-select">
    <button class="back-btn" data-back><i class="ph ph-arrow-left"></i> <span data-i18n="back">Volver</span></button>
    <h2 data-i18n="choose_level">Elige el nivel</h2>
    <div class="race-card-list" id="level-list"></div>
  </main>

  <!-- Selección de número de rivales -->
  <main class="screen" id="screen-opponent-select">
    <button class="back-btn" data-back><i class="ph ph-arrow-left"></i> <span data-i18n="back">Volver</span></button>
    <h2 data-i18n="choose_opponents">Elige el número de rivales</h2>
    <div class="option-list" id="opponent-list"></div>
  </main>

  <!-- Tablero de juego -->
  <main class="screen screen-board" id="screen-board">
    <div class="board-viewport" id="board-viewport">
      <div class="board-camera" id="board-camera">
        <div class="board-tiles" id="board-tiles"></div>
      </div>
    </div>
  </main>
