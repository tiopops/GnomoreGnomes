<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gnomore Gnomes</title>
<link rel="stylesheet" href="css/style.css?v=20260922221531">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>

  <!-- Menú principal -->
  <main class="screen screen--active main-menu" id="main-menu">
    <div class="hex-logo"></div>
    <h1><span data-i18n="game_title">Gnomore Gnomes</span></h1>

    <nav class="menu-buttons">
      <button id="btn-new-game" class="menu-btn">
        <i class="ph ph-plus-circle"></i>
        <span data-i18n="menu_new_game">Nueva Partida</span>
      </button>
      <button id="btn-resume-game" class="menu-btn" disabled>
        <i class="ph ph-arrow-clockwise"></i>
        <span data-i18n="menu_resume_game">Reanudar Partida</span>
      </button>
      <button id="btn-multiplayer" class="menu-btn menu-btn--disabled" disabled>
        <i class="ph ph-users"></i>
        <span data-i18n="menu_multiplayer">Multijugador (próximamente)</span>
      </button>
    </nav>

    <p class="menu-footer" data-i18n="menu_footer">Prototipo en construcción</p>
  </main>

  <!-- Selección de modo de juego -->
  <main class="screen" id="screen-mode-select">
    <button class="back-btn" data-back><i class="ph ph-arrow-left"></i> <span data-i18n="back">Volver</span></button>
    <h2 data-i18n="choose_mode">Elige el modo de juego</h2>
    <div class="option-list" id="mode-list"></div>
  </main>

  <!-- Selección de raza -->
  <main class="screen" id="screen-race-select">
    <button class="back-btn" data-back><i class="ph ph-arrow-left"></i> <span data-i18n="back">Volver</span></button>
    <h2 data-i18n="choose_race">Elige tu raza</h2>
    <div class="option-list" id="race-list"></div>
  </main>

  <!-- Selección de número de rivales -->
  <main class="screen" id="screen-opponent-select">
    <button class="back-btn" data-back><i class="ph ph-arrow-left"></i> <span data-i18n="back">Volver</span></button>
    <h2 data-i18n="choose_opponents">Elige el número de rivales</h2>
    <div class="option-list" id="opponent-list"></div>
  </main>

  <!-- Tablero de juego -->
  <main class="screen screen-board" id="screen-board">
    <div class="board-viewport" id="board-viewport">
      <div class="board-camera" id="board-camera">
        <div class="board-tiles" id="board-tiles"></div>
      </div>
    </div>
  </main>

  <script src="js/i18n.js?v=20260922221531"></script>
  <script src="js/sfx.js?v=20260922221531"></script>
  <script src="js/savegame.js?v=20260922221531"></script>
  <script src="js/gamemodes.js?v=20260922221531"></script>
  <script src="js/races.js?v=20260922221531"></script>
  <script src="js/matchsetup.js?v=20260922221531"></script>
  <script src="js/mapgen.js?v=20260922221531"></script>
  <script src="js/fog.js?v=20260922221531"></script>
  <script src="js/boardview.js?v=20260922221531"></script>
  <script src="js/uiconfig.js?v=20260922221531"></script>
  <script src="js/shadows.js?v=20260922221531"></script>
  <script src="js/units.js?v=20260922221531"></script>
  <script src="js/movement.js?v=20260922221531"></script>
  <script src="js/combat.js?v=20260922221531"></script>
  <script src="js/gnome.js?v=20260922221531"></script>
  <script src="js/villages.js?v=20260922221531"></script>
  <script src="js/glory.js?v=20260922221531"></script>
  <script src="js/turns.js?v=20260922221531"></script>
  <script src="js/teammarkers.js?v=20260922221531"></script>
  <script src="js/settingsmenu.js?v=20260922221531"></script>
  <script src="js/gnomecalib.js?v=20260922221531"></script>
  <script src="js/unitinfo.js?v=20260922221531"></script>
  <script src="js/backpack.js?v=20260922221531"></script>
  <script src="js/shops.js?v=20260922221531"></script>
  <script src="js/abilities.js?v=20260922221531"></script>
  <script src="js/menu.js?v=20260922221531"></script>
  <script src="js/newgame-flow.js?v=20260922221531"></script>
</body>
</html>
