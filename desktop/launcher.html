<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gnomore Gnomes</title>
<style>
  @font-face { font-family: "Russo One"; src: url("assets/RussoOne-Regular.woff2") format("woff2"); font-weight: 400; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14161f; color: #fff; font-family: "Russo One", system-ui, sans-serif; overflow: hidden; user-select: none; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 24px; }
  .logo { width: min(520px, 80vw); height: auto; filter: drop-shadow(5px 5px 0 rgba(0, 0, 0, .6)); }
  .box { width: min(460px, 86vw); min-height: 120px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .msg { font-size: 1.1rem; text-shadow: 2px 2px 0 #000; min-height: 1.5em; }
  .sub { font-size: .95rem; color: #cfc4e8; min-height: 1.3em; }
  /* Barra con el mismo corte inclinado de las barras del juego; el relleno queda dentro del marco. */
  .bar { width: 100%; height: 26px; padding: 5px 12px; background: #000; clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%); }
  .bar i { display: block; height: 100%; width: 0; background: #f0c850; clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); min-width: 6px; transition: width .12s linear; }
  .bar.ind i { width: 30% !important; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 70%; } }
  .btns { display: flex; gap: 14px; justify-content: center; }
  button { position: relative; isolation: isolate; border: 0; background: none; color: #fff; font: inherit; font-size: 1rem; padding: 12px 30px; cursor: pointer; text-shadow: 2px 2px 0 #000; }
  button::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #2b2733; clip-path: polygon(4% 0, 100% 6%, 96% 100%, 0 94%); outline: none; }
  button::after { content: ""; position: absolute; inset: 3px; z-index: -1; background: #3a3342; clip-path: polygon(4% 0, 100% 6%, 96% 100%, 0 94%); }
  button:hover::after, button:focus-visible::after { background: #4b3a66; }
  button:focus-visible { outline: none; }
  [hidden] { display: none !important; }
  .ver { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: .85rem; color: #8f86a6; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="assets/logo.png" alt="Gnomore Gnomes" draggable="false">
  <div class="box">
    <div class="msg" id="msg"></div>
    <div class="bar ind" id="bar"><i id="fill"></i></div>
    <div class="sub" id="sub"></div>
    <div class="btns">
      <button id="retry" hidden></button>
      <button id="proceed" hidden></button>
    </div>
  </div>
</div>
<div class="ver" id="ver"></div>
<script>
  const ES = /^es/i.test(navigator.language || "es");
  const T = ES ? {
    check: "Buscando actualizaciones…", download: "Descargando actualización…", install: "Instalando…", launch: "Iniciando…",
    offline: "No se pudo comprobar si hay actualización.", dl_err: "No se pudo descargar la actualización.",
    must: "Necesitas la última versión para jugar.", retry: "REINTENTAR", proceed: "CONTINUAR", ver: "Versión",
  } : {
    check: "Checking for updates…", download: "Downloading update…", install: "Installing…", launch: "Starting…",
    offline: "Could not check for updates.", dl_err: "Could not download the update.",
    must: "You need the latest version to play.", retry: "RETRY", proceed: "CONTINUE", ver: "Version",
  };
  const $ = (id) => document.getElementById(id);
  $("retry").textContent = T.retry; $("proceed").textContent = T.proceed;
  const mb = (n) => (n / 1048576).toFixed(1);
  window.ggDesktop.onStatus((s) => {
    const bar = $("bar"), fill = $("fill");
    $("retry").hidden = $("proceed").hidden = true;
    $("sub").textContent = "";
    $("ver").textContent = s.name ? T.ver + " " + s.name : "";
    bar.hidden = false;
    if (s.state === "check" || s.state === "install" || s.state === "launch") {
      $("msg").textContent = T[s.state]; bar.classList.add("ind"); fill.style.width = "";
    } else if (s.state === "download") {
      $("msg").textContent = T.download;
      if (s.total > 0) { bar.classList.remove("ind"); fill.style.marginLeft = "0"; fill.style.width = Math.min(100, (s.done / s.total) * 100) + "%"; $("sub").textContent = mb(s.done) + " / " + mb(s.total) + " MB"; }
      else { bar.classList.add("ind"); fill.style.width = ""; $("sub").textContent = s.done ? mb(s.done) + " MB" : ""; }
    } else if (s.state === "error") {
      bar.hidden = true;
      $("msg").textContent = s.kind === "download" ? T.dl_err : T.offline;
      $("sub").textContent = s.canProceed ? "" : T.must;
      $("retry").hidden = false;
      $("proceed").hidden = !s.canProceed;
      $("retry").focus();
    }
  });
  $("retry").onclick = () => window.ggDesktop.retry();
  $("proceed").onclick = () => window.ggDesktop.proceed();
  window.ggDesktop.ready();
</script>
</body>
</html>
