# Cada push a main: genera el paquete de actualización del juego (bundle.zip + version.json)
# y la APK de Android, y los publica en la Release "mobile-latest" (se reemplazan en cada push).
# La app instalada descarga bundle.zip desde el botón del menú principal (js/appupdate.js).
name: Mobile (APK + paquete de actualizacion)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copiar el juego a mobile/www
        run: bash mobile/build-www.sh "$GITHUB_WORKSPACE"

      - name: Optimizar imagenes (solo para la APK, la web no se toca)
        run: |
          sudo apt-get install -y pngquant
          python3 -m pip install --quiet pillow
          python3 mobile/optimize-www.py mobile/www
          find mobile/www/assets -name '*.png' -print0 | xargs -0 -P4 -n8 pngquant --force --skip-if-larger --quality 75-95 --speed 3 --ext .png || true
          du -sh mobile/www

      - name: Paquete de actualizacion
        run: |
          cd mobile/www
          zip -qr ../bundle.zip .
          cd ..
          # El plugin nativo (7.x) EXIGE el SHA-256 del zip al descargar: sin el, falla al instante
          # con "Failed to download". Se publica dentro del version.json de la release.
          python3 - <<'PY'
          import hashlib, json
          h = hashlib.sha256(open("bundle.zip", "rb").read()).hexdigest()
          v = json.load(open("www/version.json"))
          v["checksum"] = h
          json.dump(v, open("release-version.json", "w"), ensure_ascii=False)
          print("sha256", h)
          PY

      - name: Construir la APK
        run: |
          cd mobile
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publicar en la Release mobile-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mobile-latest >/dev/null 2>&1 || gh release create mobile-latest --prerelease --title "Android (ultima version)" --notes "APK y paquete de actualizacion. Se regenera solo en cada push."
          cp mobile/android/app/build/outputs/apk/release/app-release.apk GnomoreGnomes.apk
          gh release upload mobile-latest mobile/bundle.zip --clobber
          mkdir -p rel && cp mobile/release-version.json rel/version.json
          gh release upload mobile-latest rel/version.json --clobber
          gh release upload mobile-latest GnomoreGnomes.apk --clobber
