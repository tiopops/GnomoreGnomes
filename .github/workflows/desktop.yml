# Cada push a main: genera el paquete de actualizacion del juego para el PC (bundle.zip + version.json) y lo publica
# en la Release "desktop-latest". El instalador de Windows (GnomoreGnomes-Setup.exe) solo se reconstruye cuando cambia
# la carpeta desktop/ (o a mano) porque contiene solo el launcher: el juego lo descarga el propio launcher al abrirse.
# El launcher (desktop/main.js) compara version.json con lo instalado y no deja jugar hasta tener la ultima version.
name: Desktop (instalador Windows + paquete de actualizacion)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.chg.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release desktop-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --prerelease --title "Windows (ultima version)" --notes "Instalador y paquete de actualizacion del juego para PC. Se reemplazan solos en cada push."

      - name: Hay que reconstruir el instalador?
        id: chg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          need=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then need=true; fi
          if ! gh release view desktop-latest --json assets -q '.assets[].name' | grep -qx 'GnomoreGnomes-Setup.exe'; then need=true; fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -q '^desktop/'; then need=true; fi
          echo "installer=$need" >> "$GITHUB_OUTPUT"

      - name: Copiar el juego a desktop-www
        run: bash mobile/build-www.sh "$GITHUB_WORKSPACE" && mv mobile/www desktop-www

      - name: Paquete de actualizacion
        run: |
          cd desktop-www
          zip -qr ../bundle.zip .
          cd ..
          python3 - <<'PY'
          import hashlib, json
          h = hashlib.sha256(open("bundle.zip", "rb").read()).hexdigest()
          v = json.load(open("desktop-www/version.json"))
          v["checksum"] = h
          json.dump(v, open("version.json", "w"), ensure_ascii=False)
          print("sha256", h)
          PY

      - name: Publicar en la Release desktop-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload desktop-latest bundle.zip --clobber
          gh release upload desktop-latest version.json --clobber

  installer:
    needs: bundle
    if: needs.bundle.outputs.installer == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Construir el instalador
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win nsis --publish never

      - name: Publicar el instalador
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload desktop-latest desktop/dist/GnomoreGnomes-Setup.exe --clobber
