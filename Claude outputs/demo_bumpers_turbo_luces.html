body:before{content:"";position:fixed;inset:0;background:rgba(10,6,16,.55)}
#wrap{position:fixed;left:50%;top:50%;width:820px;height:600px;transform-origin:center;transform:translate(-50%,-50%) scale(var(--k,1))}
.fr{position:relative;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.fr:before,.fr:after{content:"";position:absolute;z-index:0}
.fr:before{inset:0;background:#000;clip-path:polygon(2% 6%,30% 0,70% 5%,98% 1%,100% 40%,97% 95%,60% 100%,25% 96%,0 99%,1.5% 50%)}
.fr:after{inset:3px;background:var(--panel);clip-path:polygon(2% 7%,30% 1.5%,70% 6%,98% 2.5%,99% 40%,96.5% 94%,60% 98.5%,25% 95%,1% 97.5%,2% 50%)}
.fr>*{position:relative;z-index:1}
#hud{z-index:100000;position:absolute;left:50%;top:14px;transform:translateX(-50%);width:640px;height:92px;padding:12px 26px;display:flex;flex-direction:column;gap:8px}
#hud .row{display:flex;align-items:center;justify-content:space-between;font-size:15px;letter-spacing:.06em}
#pips{display:flex;gap:4px;height:22px;align-items:center}
.pip{width:20px;height:18px;background:#5a4d63;clip-path:polygon(12% 0,100% 8%,88% 100%,0 92%);transition:background .2s}
.pip.on{background:var(--acc)}.pip.used{background:#2a2230}
.pip.new{animation:pop .5s}
.pip.turbo.on{background:#ff6a2b}
@keyframes pop{0%{transform:scale(2.4);filter:brightness(2)}100%{transform:scale(1)}}
#combo{color:var(--acc);font-size:20px}
#lights{display:flex;gap:6px;align-items:center}
.lamp{width:18px;height:18px;border-radius:50%;background:#2a2230;border:3px solid #000;transition:all .2s}
.lamp.on{background:#ffd23d;box-shadow:0 0 12px 3px #ffd23d}
#combo{position:absolute;left:50%;top:7%;transform:translate(-50%,0);z-index:100002;pointer-events:none;opacity:0;color:#ffd23f;white-space:nowrap;-webkit-text-stroke:7px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000}#combo.on{opacity:1}#combo.hit{animation:ch .35s cubic-bezier(.2,1.6,.4,1)}@keyframes ch{0%{transform:translate(-50%,0) scale(.6) rotate(-5deg)}40%{transform:translate(-50%,0) scale(1.3) rotate(3deg)}100%{transform:translate(-50%,0) scale(1) rotate(0)}}
#stage{position:absolute;inset:0}
.tile{position:absolute;width:80px;pointer-events:none}
.ent{position:absolute;pointer-events:none}
.bump{width:70px;transform:translate(-50%,-80%)}
.bump img{width:100%;display:block;transition:filter .25s}
.bump.dim img{filter:brightness(.8) saturate(.5)}
.bump.turbo:before{content:"";position:absolute;left:50%;top:78%;width:88px;height:42px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #ff7a2b;box-shadow:0 0 18px 4px #ff7a2b,inset 0 0 14px #ff7a2b;animation:ring 1s infinite ease-out;opacity:.9}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.7);opacity:1}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
.bump.lit:after{content:"";position:absolute;left:50%;top:40%;width:110px;height:110px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,220,80,.55),transparent 65%);animation:gl 1.4s infinite alternate;z-index:-1}
@keyframes gl{to{opacity:.45}}
.tile{transition:filter .3s}.tile.fog{filter:brightness(.38) saturate(.6) hue-rotate(15deg)}.bump.hid{opacity:0;transition:opacity .3s}.bump{transition:opacity .3s}.bump.lock:before{content:'';position:absolute;left:50%;top:78%;width:88px;height:42px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #fff;box-shadow:0 0 16px 3px #9fe8ff;animation:ring .5s infinite ease-out}
.bump.squash img{animation:sq .35s}
@keyframes sq{0%{transform:scale(1)}25%{transform:scale(1.22,.78)}55%{transform:scale(.9,1.12)}100%{transform:scale(1)}}
.bump .tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:11px;background:#000;color:#ffb27a;padding:1px 6px;clip-path:polygon(0 10%,100% 0,96% 100%,4% 90%);white-space:nowrap;display:none}
.bump.turbo .tag{display:block}
#egg{width:50px;transform:translate(-50%,-72%);z-index:9999}
#egg img{width:100%;display:block}
.ghost{width:50px;transform:translate(-50%,-72%);opacity:.5;filter:hue-rotate(-30deg) saturate(2) brightness(1.3);transition:opacity .28s}
.roulette{transform:translate(-50%,0);z-index:100001;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));animation:rin .25s cubic-bezier(.34,1.5,.64,1)}@keyframes rin{from{opacity:0;transform:translate(-50%,0) scale(.6)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.pop{position:absolute;transform:translate(-50%,0);font-size:22px;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 3px 0 #000;animation:up 1s forwards;white-space:nowrap;z-index:99999}
.pop.t{color:#ff8a3d;font-size:28px}.pop.l{color:#ffd23d}
@keyframes up{0%{transform:translate(-50%,0) scale(.4)}20%{transform:translate(-50%,-14px) scale(1.25)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
#big{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(.3);font-size:54px;color:#ffd23d;-webkit-text-stroke:8px #000;paint-order:stroke fill;opacity:0;pointer-events:none;z-index:99999;text-align:center;line-height:1}
#big small{display:block;font-size:26px;color:#fff;margin-top:6px}
#big.go{animation:big 1.6s forwards}
@keyframes big{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
#flash{position:absolute;inset:0;background:radial-gradient(circle,#fff6c0,transparent 70%);opacity:0;pointer-events:none;z-index:99998}
#flash.go{animation:fl .7s}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
#ctl{z-index:100000;position:absolute;gap:10px;width:800px;flex-wrap:wrap;justify-content:center;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:18px;align-items:center}
.btn{position:relative;border:0;background:none;font:inherit;color:#fff;font-size:20px;padding:0;cursor:pointer;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));transition:transform .12s}
.btn:active{transform:translateY(3px) scale(.97)}
.btn:before,.btn:after{content:"";position:absolute}
.btn:before{inset:0;background:#000;clip-path:polygon(1% 12%,30% 0,70% 6%,99% 0,100% 55%,98% 100%,60% 94%,28% 100%,0 90%)}
.btn:after{inset:3px;background:var(--panel);clip-path:polygon(1.5% 14%,30% 3%,70% 9%,98.5% 3%,99% 55%,97.5% 97%,60% 91%,28% 97%,1% 87%)}
.btn span{white-space:nowrap;position:relative;z-index:1;display:block;padding:15px 30px;text-align:center;letter-spacing:.05em}
.btn.main:after{background:#e07a1f}.btn.main span{font-size:22px;padding:15px 34px}
.btn.chip span{padding:10px 14px;font-size:13px}
.btn.chip.on:after{background:#2f6b3a}.btn.chip.t.on:after{background:#c4561a}.btn.chip.l.on:after{background:#a8841a}.btn.chip.f.on:after{background:#3a5f8a}
.btn.chip i{font-style:normal;display:inline-block;width:12px;height:12px;border-radius:50%;background:#555;border:2px solid #000;margin-right:9px;vertical-align:-1px}
.btn.chip.on i{background:#fff;box-shadow:0 0 8px #fff}
.btn:disabled{opacity:.6;pointer-events:none}
</style></head><body>

 </div>

let turbo=true,lights=true,busy=false,bumpEls=[];
// tablero
for(let s=0;s<=2*(N-1);s++)for(let r=0;r<N;r++){const c=s-r;if(c<0||c>=N)continue;const p=pos(r,c);const i=new Image();i.src=IMG.tile;i.className="tile";i.style.left=(p.x-40)+"px";i.style.top=(p.y-27)+"px";i.style.zIndex=s*10;i.dataset.c=c;i.dataset.r=r;tileEls.push(i);stage.appendChild(i)}
BUMPS.forEach(([r,c],k)=>{const p=pos(r,c);const d=document.createElement("div");d.className="ent bump";d.style.left=p.x+"px";d.style.top=(p.y+12)+"px";d.style.zIndex=(r+c)*10+5;d.innerHTML='<img src="'+IMG.bump+'"><div class="tag">▲▲ TURBO</div>';stage.appendChild(d);bumpEls.push(d)});
const OBST=[[3,0,'roca',64],[1,3,'pino',60],[6,3,'roca',64]];const obEls=OBST.map(([r,c,k,w])=>{const p=pos(r,c);const d=document.createElement('div');d.className='ent';d.style.cssText='transform:translate(-50%,-80%);width:'+w+'px;left:'+p.x+'px;top:'+(p.y+12)+'px;z-index:'+((r+c)*10+5);d.innerHTML='<img style="width:100%;display:block" src="'+IMG[k]+'">';stage.appendChild(d);return d});
const isOb=(r,c)=>OBST.findIndex(o=>o[0]==r&&o[1]==c);
const egg=document.createElement("div");egg.id="egg";egg.className="ent";egg.innerHTML='<img src="'+IMG.egg+'">';stage.appendChild(egg);
function setEgg(x,y,z){egg.style.left=x+"px";egg.style.top=y+"px";egg.style.zIndex=z}
function resetEgg(){const p=pos(0,2);setEgg(p.x,p.y+12,9999)}
// HUD
function pips(total,used,tur){const el=$("#pips");el.innerHTML="";for(let i=0;i<total;i++){const d=document.createElement("div");d.className="pip "+(i<used?"used":"on")+(tur&&tur.has(i)?" turbo":"");el.appendChild(d)}}
function addPips(n,t){const el=$("#pips");for(let i=0;i<n;i++){const d=document.createElement("div");d.className="pip on new"+(t?" turbo":"");d.style.animationDelay=(i*.12)+"s";el.appendChild(d)}}
function usePip(){const e=$("#pips .pip.on:not(.used)");if(e){e.classList.remove("on","turbo");e.classList.add("used")}}
function refreshLamps(lit){$("#lights").innerHTML=BUMPS.map((b,i)=>isFog(b[0],b[1])?"":'<i class="lamp'+(lit[i]?" on":"")+'"></i>').join("");$("#lights").style.visibility=lights?"visible":"hidden"}
function applyFog(){tileEls.forEach(i=>i.classList.toggle('fog',isFog(+i.dataset.r,+i.dataset.c)));BUMPS.forEach((b,i)=>bumpEls[i].classList.toggle('hid',isFog(b[0],b[1])))}
function applyLook(lit){bumpEls.forEach((b,i)=>{b.classList.toggle("turbo",turbo);b.classList.toggle("dim",lights&&!lit[i]);b.classList.toggle("lit",lights&&!!lit[i])})}
// audio
let AC;function ac(){return AC||(AC=new (window.AudioContext||window.webkitAudioContext)())}
function tone(f,d,type="square",v=.12,f2){const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}
const sHop=n=>tone(220+n*10,.07,"triangle",.07);
const sHit=n=>{tone(260*Math.pow(1.09,n),.16,"square",.12,180);tone(520*Math.pow(1.09,n),.1,"triangle",.08)};
const sTurbo=()=>{tone(300,.35,"sawtooth",.1,1500);tone(150,.3,"square",.08,900)};
const sLamp=()=>{tone(988,.35,"sine",.14);tone(1480,.4,"sine",.08)};
const sBonus=()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.3,"triangle",.14),i*90));
// efectos
function setCombo(n){const e=$('#combo');if(n<2){e.className='';return}e.textContent='COMBO X'+n+'!';e.style.fontSize=Math.min(46+n*5,96)+'px';e.className='';void e.offsetWidth;e.className='on hit'}
function pop(x,y,t,cls=""){const e=document.createElement("div");e.className="pop "+cls;e.textContent=t;e.style.left=x+"px";e.style.top=y+"px";stage.appendChild(e);setTimeout(()=>e.remove(),1000)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hop(from,to,dur,fast){return new Promise(res=>{const t0=performance.now();let g=0;(function f(now){const k=Math.min(1,(now-t0)/dur);const x=from.x+(to.x-from.x)*k,y=from.y+(to.y-from.y)*k-Math.sin(k*Math.PI)*(fast?10:20);setEgg(x,y,to.z);
 if(fast&&(g++%2==0)){const gh=document.createElement("div");gh.className="ent ghost";gh.innerHTML='<img src="'+IMG.egg+'" style="width:100%">';gh.style.left=x+"px";gh.style.top=y+"px";gh.style.zIndex=to.z-1;stage.appendChild(gh);requestAnimationFrame(()=>gh.style.opacity=0);setTimeout(()=>gh.remove(),300)}
 if(k<1)requestAnimationFrame(f);else res()})(t0)})}
function glide(from,to,dur,trail,brake){return new Promise(res=>{const t0=performance.now();let g=0;(function f(now){let k=Math.min(1,(now-t0)/dur);if(brake)k=1-Math.pow(1-k,3);const x=from.x+(to.x-from.x)*k,y=from.y+(to.y-from.y)*k-Math.sin(k*Math.PI)*(trail?12:16);setEgg(x,y,to.z);
 if(trail&&g++%2==0){const gh=document.createElement("div");gh.className="ent ghost";gh.innerHTML='<img src="'+IMG.egg+'" style="width:100%">';gh.style.left=x+"px";gh.style.top=y+"px";gh.style.zIndex=to.z-1;stage.appendChild(gh);requestAnimationFrame(()=>gh.style.opacity=0);setTimeout(()=>gh.remove(),300)}
 if(k<1)requestAnimationFrame(f);else res()})(t0)})}
let tempRock=null,slices=0,plateEl=null,plateT=null;
function plateSvg(have,color){const R=46,cx=50,cy=50,N=10;let s="";for(let i=0;i<N;i++){const a0=-Math.PI/2+i*2*Math.PI/N+.03,a1=-Math.PI/2+(i+1)*2*Math.PI/N-.03;const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);s+=`<path d="M${cx} ${cy} L${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} Z" fill="${i<have?color:"#4a3f52"}" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>`}
return `<svg width="104" height="104" viewBox="0 0 100 100"><circle cx="50" cy="50" r="49" fill="#1d1814" stroke="#000" stroke-width="3"/>${s}<circle cx="50" cy="50" r="13" fill="#1d1814" stroke="#000" stroke-width="2.5"/><text x="50" y="58" text-anchor="middle" font-family="Russo One, sans-serif" font-size="22" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">${have}</text></svg>`}
function showPlate(r,c,ms){if(plateEl)plateEl.remove();clearTimeout(plateT);const p=pos(r,c);const e=document.createElement("div");e.className="ent roulette";e.innerHTML=plateSvg(slices,"#ffd23f");e.style.left=p.x+"px";e.style.top=Math.max(125,p.y-165)+"px";stage.appendChild(e);plateEl=e;plateT=setTimeout(()=>{e.remove();plateEl=null},ms)}
// vuelo
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
function randDir(r,c){const ok=DIRS.filter(([a,b])=>{const nr=r+a,nc=c+b;return nr>=0&&nc>=0&&nr<N&&nc<N&&isOb(nr,nc)<0});return ok[Math.floor(Math.random()*ok.length)]||[-1,0]}
function pickTarget(r,c,cur,lit,seen,clear,ex){let best=null,bd=1e9;BUMPS.forEach((b,i)=>{if(i==cur||seen[i]||(ex&&ex[i])||isFog(b[0],b[1]))return;const d=Math.max(Math.abs(b[0]-r),Math.abs(b[1]-c));if(d>4)return;{const ar=b[0]-r,ac=b[1]-c,st=Math.max(Math.abs(ar),Math.abs(ac));for(let j=1;j<st;j++){if(isFog(Math.round(r+ar*j/st),Math.round(c+ac*j/st)))return}}if(clear){const ar=b[0]-r,ac=b[1]-c,st=Math.max(Math.abs(ar),Math.abs(ac));for(let j=1;j<st;j++){if(isOb(Math.round(r+ar*j/st),Math.round(c+ac*j/st))>=0)return}}const sc=d*10+Math.abs(b[0]-r)+Math.abs(b[1]-c)+(lights&&lit[i]?100:0);if(sc<bd){bd=sc;best=i}});return best}
function bounceDir(r,c,dr,dc){let best=null,bs=-1;[[dc,-dr],[-dc,dr]].forEach(([a,b])=>{let k=0,rr=r,cc=c;while(rr+a>=0&&rr+a<N&&cc+b>=0&&cc+b<N){rr+=a;cc+=b;k++}if(k>bs){bs=k;best=[a,b]}});return best}
async function launch(withRock){
 if(busy)return;
 if(tempRock){tempRock.remove();OBST.pop();obEls.pop();tempRock=null}
 if(withRock){const p=pos(3,3);OBST.push([3,3,'roca',64]);const d=document.createElement('div');d.className='ent';d.style.cssText='transform:translate(-50%,-80%);width:64px;left:'+p.x+'px;top:'+(p.y+12)+'px;z-index:'+(60+5);d.innerHTML='<img style="width:100%;display:block" src="'+IMG.roca+'">';stage.appendChild(d);d.firstChild.animate([{transform:'translateY(-120px)',opacity:0},{transform:'translateY(0)',opacity:1},{transform:'scale(1.15,.85)'},{transform:'scale(1)'}],{duration:500,easing:'ease-in'});obEls.push(d);tempRock=d}
busy=true;$("#go").disabled=true;$("#goR").disabled=true;
 const lit=[false,false,false,false];let roul=0,combo=0,total=BASE,used=0,hits=0;
 pips(total,0);$("#rem").textContent=total;setCombo(0);applyFog();refreshLamps(lit);applyLook(lit);resetEgg();
 let r=0,c=2,dr=1,dc=0,fast=false,step=0,target=null,cur=-1;const seen=[],blocked=[];
 await sleep(400);
 while(used<total){
  const from={x:parseFloat(egg.style.left),y:parseFloat(egg.style.top)};
  let n=1;
  if(target!=null){const tb=BUMPS[target];const ar=tb[0]-r,ac=tb[1]-c,st=Math.max(Math.abs(ar),Math.abs(ac));let blk=-1;for(let i=1;i<=st;i++){if(isOb(Math.round(r+ar*i/st),Math.round(c+ac*i/st))>=0){blk=i;break}}
   if(blk<0){n=Math.max(1,Math.min(st,total-used));r=tb[0];c=tb[1]}
   else{const o=isOb(Math.round(r+ar*blk/st),Math.round(c+ac*blk/st));const im=obEls[o].firstChild;im.animate([{transform:'scale(1)'},{transform:'scale(1.12,.88)'},{transform:'scale(1)'}],{duration:250});tone(140,.12,'square',.1,90);
    bumpEls.forEach(e=>e.classList.remove("lock"));blocked[target]=true;target=null;
    if(blk>1){n=blk-1;r=Math.round(r+ar*n/st);c=Math.round(c+ac*n/st)}else{n=0}
    {const rr0=r,cc0=c;const nt=pickTarget(rr0,cc0,-1,lit,seen,true,blocked);if(nt!=null){target=nt;bumpEls[nt].classList.add('lock')}else{[dr,dc]=randDir(rr0,cc0)}}
    if(n==0){const rp=pos(Math.round(r+ar/st),Math.round(c+ac/st));const hp={x:from.x+(rp.x-from.x)*.55,y:from.y+(rp.y+12-from.y)*.55,z:(r+c)*10+8};await glide(from,hp,170,true);im.animate([{transform:'scale(1)'},{transform:'scale(1.12,.88)'},{transform:'scale(1)'}],{duration:250});await sleep(120);continue}}}
  else{
   let k=0,rr=r,cc=c;
   while(k<total-used){const nr=rr+dr,nc=cc+dc;if(nr<0||nc<0||nr>=N||nc>=N||isOb(nr,nc)>=0)break;rr=nr;cc=nc;k++;const q=BUMPS.findIndex(b=>b[0]==rr&&b[1]==cc);if(q>=0&&!seen[q])break}
   if(k==0){const o=isOb(r+dr,c+dc);if(o>=0){const im=obEls[o].firstChild;im.animate([{transform:'scale(1)'},{transform:'scale(1.12,.88)'},{transform:'scale(1)'}],{duration:250});tone(140,.12,'square',.1,90);[dr,dc]=randDir(r,c)}else{dr=-dr;dc=-dc}continue}
   n=k;r=rr;c=cc}
  const p=pos(r,c);
  const to={x:p.x,y:p.y+12,z:(r+c)*10+8};
  sHop(step++);
  const last=used+n>=total;await glide(from,to,((fast?55:90)*n+130)*(last?1.8:1),fast||target!=null,last);if(last){const e=document.querySelector('#egg img');e.animate([{transform:'scale(1,1)'},{transform:'scale(1.15,.85)'},{transform:'scale(.95,1.06)'},{transform:'scale(1,1)'}],{duration:350,easing:'ease-out'})}
  for(let k=0;k<n;k++){usePip();used++}$("#rem").textContent=total-used;
  target=null;
  let bi=BUMPS.findIndex(b=>b[0]==r&&b[1]==c);if(bi>=0&&seen[bi]&&!isFog(r,c))bi=-1;
  if(bi>=0){
   bumpEls.forEach(e=>e.classList.remove("lock"));cur=bi;
   hits++;combo++;setCombo(combo);
   const be=bumpEls[bi];be.classList.remove("squash");void be.offsetWidth;be.classList.add("squash");
   const bonus=turbo?2:1;total+=bonus;addPips(bonus,turbo);$("#rem").textContent=total-used;
   sHit(hits);
   if(turbo){sTurbo();fast=true}
   if(lights&&!lit[bi]){lit[bi]=true;setTimeout(sLamp,120);applyLook(lit);refreshLamps(lit);
     if(BUMPS.every((b,i)=>isFog(b[0],b[1])||lit[i])){await sleep(250);sBonus();slices=Math.min(10,slices+3);showPlate(r,c,2200);
       const bg=$("#big");
       const fl=$("#flash");fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");
       bumpEls.forEach(b=>{b.classList.remove("squash");void b.offsetWidth;b.classList.add("squash")});
       await sleep(900);lit.fill(false);applyLook(lit);refreshLamps(lit)}}
   await sleep(fast?90:170);
   seen[bi]=true;target=pickTarget(r,c,bi,lit,seen);
   if(target!=null){bumpEls[target].classList.add("lock");fast=true}
   else{[dr,dc]=bounceDir(r,c,dr,dc)}
  }
 }
 bumpEls.forEach(e=>e.classList.remove("lock"));
 await sleep(500);if(combo>=2){const bp=pos(BUMPS[0][0],BUMPS[0][1]);slices=Math.min(10,slices+combo);showPlate(BUMPS[0][0],BUMPS[0][1],1800);sLamp();await sleep(400)}setCombo(0);
 busy=false;$("#go").disabled=false;$("#goR").disabled=false;$("#go").firstChild.textContent="LANZAR DE NUEVO";
}
function tog(id,key){$(id).onclick=()=>{if(busy)return;if(key=="t")turbo=!turbo;else lights=!lights;$(id).classList.toggle("on",key=="t"?turbo:lights);const l=[false,false,false,false];applyLook(l);refreshLamps(l);pips(BASE,0);$("#rem").textContent=BASE;$("#combo").textContent="COMBO x0"}}
$("#bF").onclick=()=>{if(busy)return;fog=!fog;$("#bF").classList.toggle("on",fog);applyFog();const l=[false,false,false,false];applyLook(l);refreshLamps(l)};$("#bM").onclick=()=>{if(busy)return;midFog=!midFog;$("#bM").classList.toggle("on",midFog);applyFog();const l=[false,false,false,false];applyLook(l);refreshLamps(l)};tog("#bL","l");$("#go").onclick=()=>launch(false);$("#goR").onclick=()=>launch(true);
applyFog();const l0=[false,false,false,false];applyLook(l0);refreshLamps(l0);pips(BASE,0);resetEgg();
function fit(){document.documentElement.style.setProperty("--k",Math.min(innerWidth/840,innerHeight/620))}fit();addEventListener("resize",fit);
</script></body></html>
