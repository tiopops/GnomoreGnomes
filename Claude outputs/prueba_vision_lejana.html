<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba Visión Lejana</title>
<style>
:root{--bg:#14161f;--ink:#f4f2f8;--muted:#a9a6b8;--accent:#2dd4bf}
@media (prefers-color-scheme: light){:root{--bg:#e9eef2;--ink:#1b1822;--muted:#55526a}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
header{padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:1.05rem;margin:0}
p{margin:0;color:var(--muted);font-size:.9rem}
button{background:var(--accent);color:#06322d;border:0;padding:8px 14px;font-weight:700;border-radius:6px;cursor:pointer}
#wrap{position:relative;margin:0 auto;width:min(100%,900px);height:560px;overflow:hidden}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
.tile{position:absolute;width:96px;height:48px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);cursor:crosshair}
.fog{position:absolute;inset:-2px;background:radial-gradient(circle at 50% 50%,#e8edf1,#cfd7de);transition:opacity .9s ease}
#unit{position:absolute;width:84px;pointer-events:none;transform:translate(-50%,-86%);filter:drop-shadow(0 6px 4px rgba(0,0,0,.4));z-index:50}
.vz-ring{position:absolute;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%);z-index:80}
.vz-mote{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#5eead4 45%,rgba(45,212,191,0) 72%);box-shadow:0 0 10px 3px rgba(94,234,212,.9);pointer-events:none;z-index:85;transform:translate(-50%,-50%)}
.vz-eye{position:absolute;pointer-events:none;z-index:90;transform:translate(-50%,-50%);filter:drop-shadow(0 0 8px #2dd4bf);animation:vz-eye 1.2s ease-out forwards}
@keyframes vz-eye{0%{opacity:0;translate:0 10px;scale:.4}25%{opacity:1;scale:1.2}100%{opacity:0;translate:0 -50px;scale:1}}
.vz-pulse{position:absolute;pointer-events:none;border-radius:50%;border:3px solid #5eead4;box-shadow:0 0 18px #2dd4bf;transform:translate(-50%,-50%);z-index:70;animation:vz-pulse .7s ease-out forwards}
@keyframes vz-pulse{from{width:16px;height:10px;opacity:1}to{width:120px;height:70px;opacity:0}}
@keyframes vz-open2{from{transform:scale(.05);opacity:0}to{transform:scale(1);opacity:1}}
#hint{position:absolute;left:12px;bottom:10px;font-size:.85rem;color:#222;background:rgba(255,255,255,.85);padding:4px 10px;border-radius:6px;z-index:200}
</style></head><body>
<header><h1>Visión Lejana — "El ojo del bosque"</h1><button id="go">Usar habilidad</button><button id="rnd">Repetir en otro punto</button><p>Pulsa "Usar habilidad" y haz clic en una casilla (o pulsa Repetir).</p></header>
<div id="wrap"><div id="board"></div><div id="hint">Clic en el mapa para elegir el punto</div></div>

  for(let i=0;i<14;i++){
    const m=mk('vz-mote',A.x,A.y-50);
    const dx=T.x-A.x, dy=T.y-(A.y-50), arc=-110-Math.random()*70;
    m.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{opacity:1,offset:.15},
      {transform:`translate(calc(-50% + ${dx*.5}px),calc(-50% + ${dy*.5+arc}px)) scale(1.2)`,offset:.5},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.5)`,opacity:.9}],
      {duration:700+Math.random()*200,delay:i*60,easing:'ease-in-out',fill:'both'}).onfinish=()=>m.remove();
  }
  const hw=TW/2, hh=TH/2;
  const top=tc(tr-R,tcn-R), right=tc(tr-R,tcn+R), bot=tc(tr+R,tcn+R), left=tc(tr+R,tcn-R);
  const P=[[top.x,top.y-hh],[right.x+hw,right.y],[bot.x,bot.y+hh],[left.x-hw,left.y]];
  const minx=Math.min(...P.map(p=>p[0])),miny=Math.min(...P.map(p=>p[1])),maxx=Math.max(...P.map(p=>p[0])),maxy=Math.max(...P.map(p=>p[1]));
  const w=maxx-minx,h=maxy-miny, pts=P.map(p=>`${p[0]-minx},${p[1]-miny}`).join(' ');
  setTimeout(()=>{
    const wrapEl=mk('',minx,miny,w,h); wrapEl.style.cssText+=';position:absolute;pointer-events:none;z-index:75;transform-origin:50% 50%;animation:vz-open2 .9s cubic-bezier(.2,.9,.3,1) forwards';
    wrapEl.innerHTML=`<svg width="${w}" height="${h}" style="overflow:visible"><defs><radialGradient id="vg" cx="50%" cy="50%" r="60%"><stop offset="55%" stop-color="#2dd4bf" stop-opacity="0"/><stop offset="100%" stop-color="#2dd4bf" stop-opacity=".38"/></radialGradient><filter id="vgl"><feGaussianBlur stdDeviation="5"/></filter></defs>
      <polygon points="${pts}" fill="url(#vg)"/><polygon points="${pts}" fill="none" stroke="#2dd4bf" stroke-width="8" opacity=".45" filter="url(#vgl)"/>
      <polygon points="${pts}" fill="none" stroke="#a7f3e8" stroke-width="2" opacity=".9" stroke-linejoin="round"/>
      <polygon points="${pts}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="14 18" opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="1.2s" repeatCount="indefinite"/></polygon>
      ${P.map(p=>`<circle cx="${p[0]-minx}" cy="${p[1]-miny}" r="8" fill="#fff" stroke="#2dd4bf" stroke-width="3"><animate attributeName="r" values="6;11;6" dur="1.2s" repeatCount="indefinite"/></circle>`).join('')}</svg>`;
    for(let k=0;k<3;k++){const rg=mk('vz-ring',T.x,T.y,40,24); rg.style.border='3px solid rgba(167,243,232,.9)'; rg.style.boxShadow='0 0 14px #2dd4bf, inset 0 0 12px #2dd4bf'; rg.style.zIndex=76;
      rg.animate([{width:'40px',height:'24px',opacity:1},{width:w+'px',height:h+'px',opacity:0}],{duration:1500,delay:k*380,easing:'ease-out',fill:'both'}).onfinish=()=>rg.remove();}
    // revelar niebla (de dentro hacia fuera)
    tiles.forEach(o=>{const d=Math.max(Math.abs(o.r-tr),Math.abs(o.c-tcn)); if(d<=R){setTimeout(()=>{o.f.style.opacity=0},d*110)}});
    for(let i=0;i<22;i++){const m=mk('vz-mote',minx+Math.random()*w,miny+h*.2+Math.random()*h*.6);
      m.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.3)'},{opacity:1,offset:.3},{opacity:0,transform:'translate(-50%,calc(-50% - 50px)) scale(.8)'}],{duration:1400,delay:Math.random()*2500,fill:'both'}).onfinish=()=>m.remove();}
    setTimeout(()=>{wrapEl.style.transition='opacity .6s';wrapEl.style.opacity=0;setTimeout(()=>wrapEl.remove(),700);
      tiles.forEach(o=>{const d=Math.max(Math.abs(o.r-tr),Math.abs(o.c-tcn)); if(d<=R&&!base.has(o)){setTimeout(()=>{o.f.style.opacity=1},d*80)}}); busy=false; document.getElementById('hint').style.display='block'},4000);
  },750);
}
document.getElementById('hint').style.display='block';
document.getElementById('go').onclick=()=>{armed=true;document.getElementById('hint').textContent='Elige el punto: clic en una casilla'};
board.addEventListener('click',e=>{const t=e.target.closest('.tile'); if(!t||!armed)return; armed=false; document.getElementById('hint').style.display='none'; cast(+t.dataset.r,+t.dataset.c)});
document.getElementById('rnd').onclick=()=>{ if(busy)return; document.getElementById('hint').style.display='none'; cast(2+Math.floor(Math.random()*8),4+Math.floor(Math.random()*8)) };
setTimeout(()=>{document.getElementById('rnd').click()},600);
</script></body></html>
