body{font-family:"Russo One",sans-serif;font-synthesis:none}
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#12161d;color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;user-select:none}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1100px;height:720px;transform-origin:center}
svg#floor{position:absolute;left:0;top:0;pointer-events:none}
.spr{position:absolute;transform:translate(-50%,-92%);pointer-events:none}
.spr img{display:block;width:100%;height:auto}
#egg{width:120px}
.bumper{width:120px;pointer-events:auto;cursor:pointer}
.bumper img{transform-origin:50% 90%}
.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
#egg img{transform-origin:50% 90%}
.ebump{animation:ebump .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes ebump{0%{transform:scale(1,1)}25%{transform:scale(1.05,.95)}55%{transform:scale(.98,1.03)}100%{transform:scale(1,1)}}
@keyframes bump{0%{transform:scale(1,1)}18%{transform:scale(1.28,.72)}45%{transform:scale(.88,1.18)}70%{transform:scale(1.06,.96)}100%{transform:scale(1,1)}}
.wave{position:absolute;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%) scale(.2);
 background:radial-gradient(ellipse,rgba(255,255,255,0) 52%,rgba(255,245,200,.55) 62%,rgba(255,210,63,.25) 74%,rgba(255,210,63,0) 82%);animation:wave .75s ease-out forwards}
@keyframes wave{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.pop{position:absolute;pointer-events:none;font:400 54px/1 "Russo One",sans-serif;color:#ffd23f;white-space:nowrap;
 -webkit-text-stroke:7px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000;transform:translate(-50%,-50%);animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-30%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-60%) scale(1.35) rotate(3deg);opacity:1}35%{transform:translate(-50%,-60%) scale(1) rotate(0)}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}
#combo{position:fixed;left:50%;top:15%;transform:translate(-50%,0);pointer-events:none;z-index:15;opacity:0;font:400 54px/1 "Russo One",sans-serif;color:#ffd23f;white-space:nowrap;-webkit-text-stroke:7px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000}
#combo.on{opacity:1}
#combo.hit{animation:chit .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes chit{0%{transform:translate(-50%,0) scale(.6) rotate(-5deg)}40%{transform:translate(-50%,0) scale(1.3) rotate(3deg)}100%{transform:translate(-50%,0) scale(1) rotate(0)}}
#jackpot{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;opacity:0;z-index:20}
#jackpot b{display:block;font:400 62px/1 "Russo One",sans-serif;color:#ffd23f;-webkit-text-stroke:8px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000;letter-spacing:4px}
#jackpot span{display:block;font:400 40px/1 "Russo One",sans-serif;color:#fff;-webkit-text-stroke:7px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000;margin-top:6px}
#jackpot.show{animation:jp 2.6s ease-out forwards}
@keyframes jp{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-6deg)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(2deg)}22%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1.05)}}
.coin{position:fixed;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc926 55%,#b87500);border:3px solid #7a4a00;pointer-events:none;z-index:19}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#roul{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,0) scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.34,1.5,.64,1)}
#roul.on{opacity:1;transform:translate(-50%,0) scale(1)}
#roul svg{display:block;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
#ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;z-index:10;flex-wrap:wrap;justify-content:center;padding:0 12px}
button{position:relative;font:400 15px/1 "Russo One",sans-serif;padding:14px 22px;border:0;background:transparent;color:#fff;cursor:pointer;transform:rotate(var(--t,0deg));transition:transform .12s}
button::before,button::after{content:"";position:absolute;clip-path:polygon(5% 0,100% 0,95% 100%,0 100%)}
button::before{inset:0;background:#000;z-index:0}
button::after{inset:2.5px;background:#372e3d;z-index:1;transition:background-color .2s}
button>span{position:relative;z-index:2}
button:nth-child(odd){--t:-1deg}button:nth-child(even){--t:1deg}
button:hover{transform:rotate(0) scale(1.04)}button:hover::after{background:#4a3f52}
button:active{transform:scale(.96)}
#hint{position:fixed;left:50%;top:14px;font-family:"Russo One",sans-serif;white-space:nowrap;font-size:13px;transform:translateX(-50%);font-size:14px;opacity:.8;text-align:center}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,4px)}}

#tiles{position:absolute;left:0;top:0;width:1100px;height:720px;pointer-events:none}
#tiles img{position:absolute;display:block;pointer-events:none}
.hit{position:absolute;pointer-events:auto;cursor:pointer;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.opt{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;pointer-events:auto;cursor:pointer;z-index:9500;transition:transform .12s}
.opt::before,.opt::after{content:"";position:absolute;clip-path:polygon(8% 4%,96% 0,100% 90%,6% 100%)}
.opt::before{inset:0;background:#000}
.opt::after{inset:3px;background:#372e3d;transition:background-color .15s}
.opt b{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font:400 26px/1 "Russo One",sans-serif;color:#fff}
.opt.hot{transform:translate(-50%,-50%) scale(1.18) rotate(-3deg)}
.opt.hot::after{background:#ffd23f}.opt.hot b{color:#000}
.opt.off{opacity:.3;pointer-events:none}
#tip{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:12;pointer-events:none;font:400 17px/1 "Russo One",sans-serif;color:#ffd23f;-webkit-text-stroke:5px #000;paint-order:stroke fill;white-space:nowrap}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse .7s ease-in-out infinite}svg#floor{z-index:8000}</style></head><body>

 const o2=a.createOscillator(),g2=a.createGain();o2.type='sine';o2.frequency.setValueAtTime(f*2.01,t);g2.gain.setValueAtTime(.0001,t);g2.gain.exponentialRampToValueAtTime(.22,t+.004);g2.gain.exponentialRampToValueAtTime(.0001,t+.22);o2.connect(g2).connect(a.destination);o2.start(t);o2.stop(t+.25);
 // clank metálico
 const nb=a.createBuffer(1,a.sampleRate*.05,a.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
 const ns=a.createBufferSource(),bp=a.createBiquadFilter(),gn=a.createGain();ns.buffer=nb;bp.type='bandpass';bp.frequency.value=2600+n*180;bp.Q.value=4;gn.gain.value=.5;ns.connect(bp).connect(gn).connect(a.destination);ns.start(t);}
function wallTick(){const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(90,t+.08);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.13);}
function chime(n){const a=ac(),t=a.currentTime;[0,4,7,12].forEach((s,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=523*Math.pow(2,(s+n)/12);g.gain.setValueAtTime(.0001,t+i*.05);g.gain.exponentialRampToValueAtTime(.25,t+i*.05+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.05+.5);o.connect(g).connect(a.destination);o.start(t+i*.05);o.stop(t+i*.05+.55);});}
function jackpotSnd(){const a=ac(),t=a.currentTime;[0,4,7,12,16,19,24,28,31,36].forEach((s,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=i%2?'triangle':'square';o.frequency.value=392*Math.pow(2,s/12);g.gain.setValueAtTime(.0001,t+i*.07);g.gain.exponentialRampToValueAtTime(.2,t+i*.07+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.07+.45);o.connect(g).connect(a.destination);o.start(t+i*.07);o.stop(t+i*.07+.5);});
 for(let k=0;k<14;k++){const tt=t+.5+k*.06,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=1500+Math.random()*1200;g.gain.setValueAtTime(.12,tt);g.gain.exponentialRampToValueAtTime(.0001,tt+.12);o.connect(g).connect(a.destination);o.start(tt);o.stop(tt+.14);}}
// efectos visuales
function wave(r,c){const p=C(r,c);const d=document.createElement('div');d.className='wave';d.style.left=p.x+'px';d.style.top=(p.y+4)+'px';d.style.width='340px';d.style.height='170px';d.style.zIndex=(r+c)*10+2;stage.appendChild(d);setTimeout(()=>d.remove(),800);}
function pop(r,c,txt,size){const p=C(r,c),d=document.createElement('div');d.className='pop';d.textContent=txt;d.style.left=p.x+'px';d.style.top=(p.y-70)+'px';d.style.zIndex=9999;if(size)d.style.fontSize=size+'px';stage.appendChild(d);setTimeout(()=>d.remove(),1000);}
function bumpAnim(i){const im=bEls[i].querySelector('img');im.classList.remove('bump');void im.offsetWidth;im.classList.add('bump');}
// ruleta (misma estética que los tambores: plato oscuro + porciones)
let slices=0;const MAXS=10;
function rouletteSVG(have){const R=46,cx=50,cy=50;let s='';for(let i=0;i<MAXS;i++){const a0=-Math.PI/2+i*2*Math.PI/MAXS+.03,a1=-Math.PI/2+(i+1)*2*Math.PI/MAXS-.03;
 const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
 s+=`<path d="M${cx} ${cy} L${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} Z" fill="${i<have?'#ffd23f':'#4a3f52'}" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>`;}
 return `<svg width="112" height="112" viewBox="0 0 100 100"><circle cx="50" cy="50" r="49" fill="#1d1814" stroke="#000" stroke-width="3"/>${s}<circle cx="50" cy="50" r="13" fill="#1d1814" stroke="#000" stroke-width="2.5"/><text x="50" y="58" text-anchor="middle" font-family="Russo One" font-size="22" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">${have}</text></svg>`;}
const roul=document.getElementById('roul');function drawRoul(){roul.innerHTML=rouletteSVG(slices);}
function toggleRoul(i){const p=C(...BUMPERS[i]);roul.style.left=p.x+'px';roul.style.top=(p.y-190)+'px';drawRoul();roul.classList.toggle('on');}
drawRoul();
// lanzamiento
let busy=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showCombo(n){const e=document.getElementById('combo');e.textContent='COMBO X'+n+'!';e.style.fontSize=(46+n*5)+'px';e.classList.add('on');e.classList.remove('hit');void e.offsetWidth;e.classList.add('hit');}
async function comboToRoulette(n){const e=document.getElementById('combo');
 const sr=stage.getBoundingClientRect(),k=sr.width/stage.offsetWidth,p=C(...BUMPERS[0]);
 const tx=sr.left+p.x*k,ty=sr.top+(p.y-135)*k,er=e.getBoundingClientRect();
 roul.style.left=p.x+'px';roul.style.top=(p.y-190)+'px';drawRoul();roul.classList.add('on');
 await e.animate([{transform:'translate(-50%,0) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${tx-(er.left+er.width/2)}px),${ty-er.top}px) scale(.35)`,opacity:1}],{duration:520,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'}).finished;
 e.classList.remove('on');e.getAnimations().forEach(a=>a.cancel());
 slices=Math.min(MAXS,slices+n);drawRoul();blip(6);roul.firstElementChild.animate([{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:300,easing:'ease-out'});
 await sleep(1400);roul.classList.remove('on');}
async function launch(){let combo=0;
 const eggBump=()=>{const im=eggEl.querySelector('img');im.classList.remove('ebump');void im.offsetWidth;im.classList.add('ebump');};
 // waypoints en coordenadas de rejilla, con eventos de contacto
 const wp=[{r:egg.r,c:egg.c}];STEPS.forEach(s=>{if(s.bounced)wp.push({r:(s.pr+s.wr)/2,c:(s.pc+s.wc)/2,ev:s});wp.push({r:s.r,c:s.c});});
 let cum=[0];for(let k=1;k<wp.length;k++){const a=C(wp[k-1].r,wp[k-1].c),b=C(wp[k].r,wp[k].c);cum.push(cum[k-1]+Math.hypot(b.x-a.x,b.y-a.y));}
 const L=cum[cum.length-1],V=620,TD=1.6,T=L/V+TD/2;
 const dist=t=>t>T-TD?L-V*(T-t)*(T-t)/(2*TD):V*t;
 let nextEv=0;const evs=wp.map((w,k)=>w.ev?{d:cum[k],s:w.ev}:null).filter(Boolean);
 await new Promise(res=>{const t0=performance.now();(function f(now){const t=Math.min((now-t0)/1000,T),d=Math.min(dist(t),L);
  let k=1;while(k<cum.length-1&&cum[k]<d)k++;const u=(d-cum[k-1])/((cum[k]-cum[k-1])||1),a=wp[k-1],b=wp[k];
  const r=a.r+(b.r-a.r)*u,c=a.c+(b.c-a.c)*u,p=C(r,c);eggEl.style.transition='none';eggEl.style.left=p.x+'px';eggEl.style.top=(p.y+14)+'px';eggEl.style.zIndex=Math.round((r+c)*10+6);
  while(nextEv<evs.length&&d>=evs[nextEv].d-0.5){const s=evs[nextEv++].s;eggBump();
   if(s.hit>=0){combo++;blip(combo-1);bumpAnim(s.hit);wave(BUMPERS[s.hit][0],BUMPERS[s.hit][1]);if(combo>=2){showCombo(combo);chime(combo*2);}}else wallTick();}
  if(t<T)requestAnimationFrame(f);else res();})(t0);});
 if(combo>=2)await comboToRoulette(combo);else document.getElementById('combo').classList.remove('on');
 const last=STEPS[STEPS.length-1];if(last){egg={r:last.r,c:last.c};}await sleep(500);busy=false;placeAll();}

function whoosh(){const a=ac(),t=a.currentTime,n=a.createBuffer(1,a.sampleRate*.2,a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/d.length);
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=n;f.type='bandpass';f.Q.value=2;f.frequency.setValueAtTime(600,t);f.frequency.exponentialRampToValueAtTime(3200,t+.17);g.gain.value=.5;s.connect(f).connect(g).connect(a.destination);s.start(t);}
function thwack(){const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(55,t+.12);g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.2);}
// lanzamiento del gnomo: casi recto, rapido, con saña
async function throwGnome(){gnomeEl.style.display="none";const from=C(gnome.r,gnome.c),to=C(egg.r,egg.c);
 const d=document.createElement('div');d.className='spr';d.style.width='78px';d.style.zIndex=9000;d.style.pointerEvents='none';const im=document.createElement('img');im.src=GNOME_IMG;d.appendChild(im);stage.appendChild(d);
 const ang=Math.atan2(to.y-from.y,to.x-from.x)*180/Math.PI,DUR=380,PEAK=8;whoosh();let last=0;
 await new Promise(res=>{const t0=performance.now();(function f(now){const t=Math.min((now-t0)/DUR,1),e=t*t*(1.7-.7*t);
  const x=from.x+(to.x-from.x)*e,y=from.y+(to.y-from.y)*e-Math.sin(Math.PI*e)*PEAK+14;d.style.left=x+'px';d.style.top=y+'px';
  im.style.transform=`scale(${1+.2*Math.sin(Math.PI*t)},${1-.08*Math.sin(Math.PI*t)})`;
  if(now-last>38){last=now;const g=document.createElement('img');g.src=GNOME_IMG;g.className='spr';g.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:78px;opacity:.28;pointer-events:none;z-index:8999;transform:translate(-50%,-92%)`;stage.appendChild(g);g.animate([{opacity:.28},{opacity:0}],{duration:260}).onfinish=()=>g.remove();}
  if(t<1)requestAnimationFrame(f);else res();})(t0);});
 thwack();pop(egg.r,egg.c,'+5',34);
 // el huevo sale ya; el gnomo cae de culo, se levanta y huye
 gnomeFall(d,im,to);}
async function gnomeFall(d,im,from){const land=C(gnome.r,gnome.c),flee=C(gnome.r>N/2?N-1:0,gnome.c>N/2?N-1:0);
 im.src=SIT_IMG;im.style.transform='';d.style.width='84px';
 // rebota hacia atrás y cae al suelo
 await new Promise(res=>{const t0=performance.now(),D=420;(function f(now){const t=Math.min((now-t0)/D,1),x=from.x+(land.x-from.x)*t,y=from.y+(land.y-from.y)*t-Math.sin(Math.PI*t)*46+14;d.style.left=x+'px';d.style.top=y+'px';if(t<1)requestAnimationFrame(f);else res();})(t0);});
 d.style.zIndex=Math.round((egg.r+egg.c)*10+8);
 im.animate([{transform:'scale(1.25,.7)'},{transform:'scale(.92,1.1)'},{transform:'scale(1.06,.95)'},{transform:'scale(1,1)'}],{duration:420,easing:'ease-out'});
 await sleep(320);
 // se levanta: se contrae y salta
 im.src=IDLE_IMG;d.style.width='70px';
 await im.animate([{transform:'scale(1.15,.8)'},{transform:'scale(.9,1.2) translateY(-14px)'},{transform:'scale(1,1)'}],{duration:380,easing:'cubic-bezier(.2,1.4,.4,1)'}).finished;
 // sale corriendo
 im.src=RUN_IMG;d.style.width='72px';const flip=flee.x<land.x?-1:1;
 await new Promise(res=>{const t0=performance.now(),D=900;(function f(now){const t=Math.min((now-t0)/D,1),x=land.x+(flee.x-land.x)*t,y=land.y+(flee.y-land.y)*t+14-Math.abs(Math.sin(t*Math.PI*6))*7;d.style.left=x+'px';d.style.top=y+'px';im.style.transform=`scaleX(${flip}) rotate(${Math.sin(t*Math.PI*12)*4}deg)`;if(t<1)requestAnimationFrame(f);else res();})(t0);});
 await d.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'}).finished;d.remove();gnomeEl.style.display='';gnomeEl.style.opacity=0;gnomeEl.animate([{opacity:0},{opacity:1}],{duration:300,fill:'forwards'});}
function jackpot(){const v=slices||7;ac();const f=document.getElementById('flash');f.style.transition='none';f.style.opacity=.9;void f.offsetWidth;f.style.transition='opacity .5s';f.style.opacity=0;
 stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');
 document.getElementById('jpv').textContent='+'+v+'!';const j=document.getElementById('jackpot');j.classList.remove('show');void j.offsetWidth;j.classList.add('show');jackpotSnd();
 for(let i=0;i<46;i++){const c=document.createElement('div');c.className='coin';c.style.left='50%';c.style.top='40%';document.body.appendChild(c);
  const a=Math.random()*Math.PI*2,d=240+Math.random()*420,dx=Math.cos(a)*d,dy=Math.sin(a)*d*.6-120;
  c.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1)`,opacity:1,offset:.55},{transform:`translate(calc(-50% + ${dx*1.1}px),calc(-50% + ${dy+280}px)) scale(.7)`,opacity:0}],{duration:1500+Math.random()*700,delay:Math.random()*250,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>c.remove();}
 slices=0;drawRoul();}



document.getElementById('b3').onclick=jackpot;document.getElementById('b5').onclick=()=>{relocate=!relocate;hot=-1;document.querySelector('#b5 span').textContent='Reubicar: '+(relocate?'SÍ (clic gnomo · Mayús huevo)':'NO');document.getElementById('tip').textContent='';drawArrows();drawTrails();};
document.getElementById('b4').onclick=()=>{busy=false;egg={r:4,c:3};gnome={r:5,c:2};hot=-1;slices=0;drawRoul();roul.classList.remove('on');placeAll();};
function fit(){const s=Math.min(innerWidth/960,(innerHeight-90)/640,1.7);stage.style.transform=`scale(${s})`;}fit();addEventListener('resize',fit);
