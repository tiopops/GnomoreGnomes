body{font-family:"Russo One",sans-serif;font-synthesis:none}
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#12161d;color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;user-select:none}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1100px;height:620px;transform-origin:center}
svg#floor{position:absolute;left:0;top:0;pointer-events:none}
.spr{position:absolute;transform:translate(-50%,-92%);pointer-events:none}
.spr img{display:block;width:100%;height:auto}
#egg{width:120px}
.bumper{width:120px;pointer-events:auto;cursor:pointer}
.bumper img{transform-origin:50% 90%}
.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
#egg img{transform-origin:50% 90%}
.ebump{animation:ebump .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes ebump{0%{transform:scale(1,1)}25%{transform:scale(1.05,.95)}55%{transform:scale(.98,1.03)}100%{transform:scale(1,1)}}
@keyframes bump{0%{transform:scale(1,1)}18%{transform:scale(1.28,.72)}45%{transform:scale(.88,1.18)}70%{transform:scale(1.06,.96)}100%{transform:scale(1,1)}}
.wave{position:absolute;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%) scale(.2);
 background:radial-gradient(ellipse,rgba(255,255,255,0) 52%,rgba(255,245,200,.55) 62%,rgba(255,210,63,.25) 74%,rgba(255,210,63,0) 82%);animation:wave .75s ease-out forwards}
@keyframes wave{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.pop{position:absolute;pointer-events:none;font:400 54px/1 "Russo One",sans-serif;color:#ffd23f;white-space:nowrap;
 -webkit-text-stroke:7px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000;transform:translate(-50%,-50%);animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-30%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-60%) scale(1.35) rotate(3deg);opacity:1}35%{transform:translate(-50%,-60%) scale(1) rotate(0)}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}

#combo.on{opacity:1}

@keyframes chit{0%{transform:translate(-50%,0) scale(.6) rotate(-5deg)}40%{transform:translate(-50%,0) scale(1.3) rotate(3deg)}100%{transform:translate(-50%,0) scale(1) rotate(0)}}

button:hover{transform:rotate(0) scale(1.04)}button:hover::after{background:#4a3f52}

function sim(start,dir,dist){let [r,c]=start,[dr,dc]=dir;const steps=[];
 const wall=(a,b)=>a<0||b<0||a>=N||b>=N||BUMPERS.some(x=>x[0]==a&&x[1]==b);

function whoosh(){const a=ac(),t=a.currentTime,n=a.createBuffer(1,a.sampleRate*.2,a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/d.length);
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=n;f.type='bandpass';f.Q.value=2;f.frequency.setValueAtTime(600,t);f.frequency.exponentialRampToValueAtTime(3200,t+.17);g.gain.value=.5;s.connect(f).connect(g).connect(a.destination);s.start(t);}
function thwack(){const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(55,t+.12);g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.2);}
