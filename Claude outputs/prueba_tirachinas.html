<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba Tirachinas</title>
<style>
:root{--bg:#e9eef2;--ink:#1b1822;--muted:#55526a}
@media (prefers-color-scheme: dark){:root{--bg:#14161f;--ink:#f4f2f8;--muted:#a9a6b8}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
header{padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:1.05rem;margin:0} p{margin:0;color:var(--muted);font-size:.9rem}
button{background:#f59e0b;color:#2a1800;border:0;padding:8px 14px;font-weight:700;border-radius:6px;cursor:pointer}
#wrap{position:relative;margin:0 auto;width:min(100%,900px);overflow:hidden}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
.tile{position:absolute;width:96px;height:48px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.u{position:absolute;pointer-events:none;transform:translate(-50%,-86%);filter:drop-shadow(0 6px 4px rgba(0,0,0,.4));z-index:50;transition:none}
.fx{position:absolute;pointer-events:none;transform:translate(-50%,-50%)}
</style></head><body>
<header><h1>Lanzamiento — tensión del tirachinas</h1><button id="go">Usar habilidad</button><p>El LanzaGnomos tensa la goma, el rival se encoge y sale disparado.</p></header>

  let vx=Dd.x-T.x,vy=Dd.y-T.y;const L=Math.hypot(vx,vy);vx/=L;vy/=L;
  const hand={x:G.x+ -2,y:G.y-28};           // manos del goblin
  const CH=900;
  // ---- TENSIÓN ----
  const t0=performance.now();
  await new Promise(res=>{const f=now=>{
    const k=Math.min(1,(now-t0)/CH),e=ease(k);
    // el rival se agacha y se echa hacia atrás (hacia el goblin), el goblin se inclina atrás
    const back=e*26, sq=e;
    const tx=T.x-vx*back, ty=T.y-vy*back;
    const tremT=k>.5?(k-.5)*2*2.2:0, tremG=k*2.4;
    tg.style.left=(tx+(Math.random()-.5)*tremT)+'px';tg.style.top=(ty+8+(Math.random()-.5)*tremT)+'px';
    tg.style.transform=`translate(-50%,-86%) scale(${1+.16*sq},${1-.26*sq}) rotate(${-vx*10*sq}deg)`;
    gb.style.left=(G.x-vx*14*e+(Math.random()-.5)*tremG)+'px';gb.style.top=(G.y+8+(Math.random()-.5)*tremG)+'px';
    gb.style.transform=`translate(-50%,-86%) rotate(${-vx*-8*e}deg) scale(${1+.04*e},${1-.07*e})`;
    // goma: dos tiras desde las manos del goblin hasta la espalda del rival, rectas y cada vez más finas/rojas
    const bx=tx-vx*10,by=ty-26;
    const sag=(1-e)*26+Math.sin(now/38)*e*2.2;
    const w=7-4.2*e; const r=Math.round(150+80*e), gcol=Math.round(95-40*e);
    const col=`rgb(${r},${gcol},40)`;
    svg.innerHTML=`<path d="M${hand.x-6} ${hand.y} Q${(hand.x+bx)/2} ${(hand.y+by)/2+sag} ${bx} ${by-8}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>
      <path d="M${hand.x+6} ${hand.y+6} Q${(hand.x+bx)/2} ${(hand.y+by)/2+sag+8} ${bx} ${by+8}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`
      +(e>.3?[0,1,2].map(i=>{const m=.25+i*.25,px=hand.x+(bx-hand.x)*m,py=hand.y+(by-hand.y)*m+sag*(1-(2*m-1)**2)*.5;const o=(Math.random()-.5)*8;return `<line x1="${px-5}" y1="${py-8+o}" x2="${px+5}" y2="${py-14+o}" stroke="#fff4c2" stroke-width="2" stroke-linecap="round" opacity="${e*.9}"/>`}).join(''):'');
    // anillo de carga que se contrae sobre el rival
    if(!window._ring){window._ring=mk('fx',0,0,'');window._ring.style.cssText+=';border-radius:50%;border:3px solid rgba(255,200,80,.9);box-shadow:0 0 12px rgba(255,170,40,.7);z-index:60'}
    const rs=1-e;window._ring.style.left=tx+'px';window._ring.style.top=(ty+6)+'px';window._ring.style.width=(30+170*rs)+'px';window._ring.style.height=(16+95*rs)+'px';window._ring.style.opacity=(.2+.8*e)*(k<.97?1:0);
    if(k<1)requestAnimationFrame(f);else res()};requestAnimationFrame(f)});
  window._ring&&window._ring.remove();window._ring=null;
  // ---- SOLTAR: la goma restalla ----
  const bx0=T.x-vx*26-vx*10,by0=T.y-vy*26-26;
  svg.innerHTML=`<line x1="${hand.x}" y1="${hand.y+3}" x2="${bx0}" y2="${by0}" stroke="#fff" stroke-width="9" stroke-linecap="round"/>`;
  const snap=mk('fx',bx0,by0,'');snap.style.cssText+=';width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#fffbe0,rgba(255,224,138,0) 70%);z-index:310';
  snap.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:'translate(-50%,-50%) scale(1.6)',opacity:0}],{duration:300,fill:'both'}).onfinish=()=>snap.remove();
  svg.animate([{opacity:1},{opacity:0}],{duration:160,fill:'forwards'});
  gb.animate([{transform:gb.style.transform},{transform:'translate(-50%,-86%) rotate(5deg) scale(.96,1.08)',offset:.3},{transform:'translate(-50%,-86%)'}],{duration:320,easing:'ease-out'});
  gb.style.left=G.x+'px'; gb.style.top=(G.y+8)+'px';
  dust(T.x,T.y+10,6,28);
  // ---- VUELO con estela ----
  const DUR=520, start={x:T.x-vx*26,y:T.y-vy*26+8}, end={x:Dd.x,y:Dd.y+8};
  tg.style.zIndex=900;
  const trail=[];
  await new Promise(res=>{const t1=performance.now();const f=now=>{
    const t=Math.min(1,(now-t1)/DUR);const x=start.x+(end.x-start.x)*t,y=start.y+(end.y-start.y)*t,h=4*t*(1-t),arc=-90*h;
    tg.style.left=x+'px';tg.style.top=(y+arc)+'px';
    const ec=t<.12?1-t/.12:t>.88?(t-.88)/.12:0;
    tg.style.transform=`translate(-50%,-86%) scale(${1+ec*.16-h*.05},${1+h*.12-ec*.22})`;
    if(now-(window._lg||0)>38){window._lg=now;const gh=tg.cloneNode();gh.className='fx';gh.style.cssText=`position:absolute;left:${x}px;top:${y+arc}px;width:84px;transform:translate(-50%,-86%) scale(${1+ec*.16-h*.05},${1+h*.12-ec*.22});opacity:.5;z-index:850;filter:saturate(.6) brightness(1.15);pointer-events:none`;board.appendChild(gh);
      gh.animate([{opacity:.5},{opacity:0}],{duration:360,fill:'both'}).onfinish=()=>gh.remove()}
    if(t<1)requestAnimationFrame(f);else res()};requestAnimationFrame(f)});
  tg.style.transform='translate(-50%,-86%)';place(tg,D.r,D.c);
  tg.animate([
    {transform:'translate(-50%,-86%) scale(1.28,.68)',offset:0},
    {transform:'translate(-50%,calc(-86% - 14px)) scale(.9,1.14)',offset:.28},
    {transform:'translate(-50%,-86%) scale(1.12,.86)',offset:.52},
    {transform:'translate(-50%,calc(-86% - 4px)) scale(.97,1.04)',offset:.74},
    {transform:'translate(-50%,-86%) scale(1.03,.97)',offset:.9},
    {transform:'translate(-50%,-86%) scale(1,1)',offset:1}
  ],{duration:620,easing:'ease-out'});
  dust(Dd.x,Dd.y+10,7,32);
  const ring=mk('fx',Dd.x,Dd.y+4,'');ring.style.cssText+=';border-radius:50%;border:4px solid rgba(120,95,60,.9);z-index:60';
  ring.animate([{width:'40px',height:'22px',opacity:1},{width:'220px',height:'120px',opacity:0,borderWidth:'1px'}],{duration:520,easing:'ease-out',fill:'both'}).onfinish=()=>ring.remove();
  await wait(1200);busy=false;
}
document.getElementById('go').onclick=launch;
setTimeout(launch,500);
