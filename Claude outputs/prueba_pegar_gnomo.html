const HAND={x:350+40,y:178}; // posición del gnomo en la mano
function rest(){gn.style.left=HAND.x+'px';gn.style.top=HAND.y+'px';gn.src=GI;u.src=IDLE}
rest();
const mk=(cls,x,y,h)=>{const e=document.createElement('div');e.className='fx '+cls;e.style.left=x+'px';e.style.top=y+'px';if(h)e.innerHTML=h;st.appendChild(e);return e};
const fin=(a,e)=>a.onfinish=()=>e.remove();
let busy=false;
async function hit(d){
  if(busy)return;busy=true;rest();
  const k=(d-1)/5;
  const W=100+480*k;          // anticipación: flojo corta, fuerte lenta
  const LUNGE=85+45*k;      // embestida: el fuerte llega más rápido al impacto
  const T=1;
  const F=0.5+0.5*k; // duración del resto (rebotes, gnomo, destello, puntos): flojo = muy rápido
  const P={x:HAND.x,y:HAND.y};
  u.style.transformOrigin='50% 100%';
  // 1) ANTICIPACIÓN de goma (se encoge y echa atrás; cuanto más fuerte, más lenta y más profunda)
  const dep=.5+.5*k;
  gn.animate([{transform:'translate(-50%,-50%) scale(1,1)'},{transform:`translate(-50%,-50%) scale(${1+.14*dep},${1-.16*dep})`}],{duration:W,fill:'forwards',easing:'ease-in-out'});
  await u.animate([
    {transform:'translateX(0) scale(1,1)'},
    {transform:`translateX(${-10-14*dep}px) scale(${1+.18*dep},${1-.22*dep})`}
  ],{duration:W,fill:'forwards',easing:'ease-in-out'}).finished;
  // 2a) EMBESTIDA: acelera hacia el impacto (ease-in) y se estira
  u.src=PEG;
  await u.animate([
    {transform:`translateX(${-10-14*dep}px) scale(${1+.18*dep},${1-.22*dep})`},
    {transform:`translateX(${22+14*k}px) scale(.86,1.2)`}
  ],{duration:LUNGE,fill:'forwards',easing:'cubic-bezier(.6,0,1,.6)'}).finished;
  // 2b) tras el impacto: rebotes de goma hasta asentarse
  u.animate([
    {transform:`translateX(${22+14*k}px) scale(.86,1.2)`,offset:0},
    {transform:'translateX(6px) scale(1.12,.9)',offset:.3},
    {transform:'translateX(-3px) scale(.96,1.05)',offset:.55},
    {transform:'translateX(1px) scale(1.02,.98)',offset:.8},
    {transform:'translateX(0) scale(1,1)',offset:1}
  ],{duration:520*F,fill:'forwards',easing:'ease-out'});
  // 3) IMPACTO: el gnomo se aplasta como gelatina y vibra varias veces
  gn.src=GG;
  const jel=[[1.55,.55,0],[.8,1.3,.2],[1.2,.85,.4],[.92,1.1,.6],[1.06,.95,.8],[1,1,1]];
  gn.animate(jel.map(([x,y,o])=>({transform:`translate(-50%,-50%) translateX(${o<.5?(1-o)*14:0}px) scale(${x},${y})`,offset:o})),{duration:620*F,easing:'ease-out'});
  const S=70+40*k;
  const fl=mk('',P.x,P.y);fl.style.cssText+=`width:${S}px;height:${S}px;border-radius:50%;background:radial-gradient(circle,#fffbe0 0%,#ffe08a 45%,rgba(245,158,11,0) 72%);z-index:30`;
  fin(fl.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:1},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.35},{transform:'translate(-50%,-50%) scale(1.5)',opacity:0}],{duration:380*F,easing:'ease-out',fill:'both'}),fl);
  // 4) PUNTOS: salen con rebote elástico (se estiran al subir y se aplastan al detenerse)
  const pp=mk('pop',P.x,P.y-50,'+'+d);pp.style.fontSize=(30+4*d)+'px';
  fin(pp.animate([
    {transform:'translate(-50%,-50%) scale(.2,.2)',opacity:0},
    {transform:'translate(-50%,-110%) scale(.8,1.5)',opacity:1,offset:.18},
    {transform:'translate(-50%,-135%) scale(1.4,.75)',opacity:1,offset:.32},
    {transform:'translate(-50%,-150%) scale(.95,1.1)',opacity:1,offset:.48},
    {transform:'translate(-50%,-150%) scale(1.03,.97)',opacity:1,offset:.62},
    {transform:'translate(-50%,-150%) scale(1,1)',opacity:1,offset:.75},
    {transform:'translate(-50%,-200%) scale(1,1)',opacity:0}
  ],{duration:1300*F,easing:'ease-out',fill:'both'}),pp);
  await new Promise(r=>setTimeout(r,420*F));
  gn.src=GI;u.src=IDLE;await new Promise(r=>setTimeout(r,700));busy=false;
}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>hit(+b.dataset.d));
setTimeout(()=>hit(4),500);
</script></body></html>
