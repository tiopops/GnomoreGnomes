<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Ahogarse</title>
<style>
:root{--bg:#e9eef2;--ink:#1b1822;--muted:#55526a}
@media (prefers-color-scheme: dark){:root{--bg:#14161f;--ink:#f4f2f8;--muted:#a9a6b8}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
header{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:1.05rem;margin:0;width:100%}p{margin:0;color:var(--muted);font-size:.9rem;width:100%}
button{background:#f59e0b;color:#2a1800;border:0;padding:8px 14px;font-weight:700;border-radius:6px;cursor:pointer}
#wrap{position:relative;margin:0 auto;width:min(100%,900px);overflow:hidden}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
.tile{position:absolute;width:96px;height:48px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.fx{position:absolute;pointer-events:none;transform:translate(-50%,-50%)}
.u{position:absolute;pointer-events:none;transform-origin:50% 90%}
</style></head><body>
<header><h1>Ahogarse — salpicaduras y pataleo</h1><button id="go">Lanzar al agua</button>
<p>La unidad cae al agua, patalea y se hunde entre salpicaduras, burbujas y sonidos de agua. Pulsa el botón para empezar (el navegador exige un clic para activar el sonido).</p></header>

// ---------- Sonido (sintetizado) ----------
let AC,OUT;
function au(){if(!AC){AC=new (window.AudioContext||window.WebAudioContext||webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=.9;const c=AC.createDynamicsCompressor();OUT.connect(c);c.connect(AC.destination)}AC.resume();return AC}
function nz(len){const L=Math.round(AC.sampleRate*len),b=AC.createBuffer(1,L,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<L;i++)d[i]=Math.random()*2-1;return b}
function noise(t,len,type,f0,f1,g,q=1){const n=AC.createBufferSource();n.buffer=nz(len);const f=AC.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+len);
  const a=AC.createGain();a.gain.setValueAtTime(.0001,t);a.gain.linearRampToValueAtTime(g,t+Math.min(.03,len*.25));a.gain.exponentialRampToValueAtTime(.0001,t+len);n.connect(f);f.connect(a);a.connect(OUT);n.start(t);n.stop(t+len)}
function bloop(t,f0,f1,len,g){const o=AC.createOscillator(),a=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+len*.7);
  a.gain.setValueAtTime(.0001,t);a.gain.linearRampToValueAtTime(g,t+.012);a.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(a);a.connect(OUT);o.start(t);o.stop(t+len+.02)}
// chapuzón: golpe de agua + "bloop" grave que sube y luego burbujeo
function sndSplash(){const t=AC.currentTime;noise(t,.55,'lowpass',3800,300,.55);noise(t+.02,.35,'highpass',2500,1200,.25);bloop(t+.02,180,90,.38,.5);bloop(t+.12,300,620,.25,.28)}
// pataleo: chapoteo en ritmo rápido, con plips agudos al azar
function sndFlail(){const t=AC.currentTime;noise(t,.12,'bandpass',900+Math.random()*500,500,.2,2);if(Math.random()<.6)bloop(t+.03,500+Math.random()*500,900+Math.random()*500,.1,.12)}
// burbujas: "glub glub" ascendentes
function sndBubbles(){const t=AC.currentTime;[0,.11,.2,.34,.43,.55].forEach((d,i)=>bloop(t+d,260+i*30+Math.random()*60,520+i*80,.14,.22))}
// plop final: gota grave y redonda
function sndPlop(){const t=AC.currentTime;bloop(t,420,120,.28,.55);noise(t,.1,'lowpass',2200,400,.18)}
let busy=false;
// gotas: arcos de agua que salen y caen
function drops(x,y,n,pow,z){for(let i=0;i<n;i++){const sz=5+Math.random()*7;const d=mk(x,y,z,`width:${sz}px;height:${sz*1.3}px;border-radius:50% 50% 60% 60%;background:radial-gradient(circle at 35% 30%,#fff,#bfe3ff 55%,#7fbdee)`);
  const ang=-1.57+(Math.random()-.5)*2.4,v=(40+Math.random()*70)*pow,tx=Math.cos(ang)*v,ty=Math.sin(ang)*v*.6;
  fin(d.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${tx}px),calc(-50% + ${ty-50*pow}px)) scale(1)`,opacity:1,offset:.45},{transform:`translate(calc(-50% + ${tx*1.3}px),calc(-50% + ${ty+16}px)) scale(.4)`,opacity:0}],{duration:520+Math.random()*320,easing:'cubic-bezier(.3,.7,.5,1)',fill:'both'}),d)}}
function ring(x,y,big,z){const r=mk(x,y,z,'border:3px solid rgba(235,248,255,.95);border-radius:50%;box-sizing:border-box');
  fin(r.animate([{width:'20px',height:'10px',opacity:1,borderWidth:'4px'},{width:(big?200:110)+'px',height:(big?104:58)+'px',opacity:0,borderWidth:'1px'}],{duration:big?800:560,easing:'cubic-bezier(.15,.7,.3,1)',fill:'both'}),r)}
function bubbles(x,y,n,z){for(let i=0;i<n;i++){const s=4+Math.random()*8;const b=mk(x+(Math.random()-.5)*34,y-10,z,`width:${s}px;height:${s}px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.25)`);
  fin(b.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{opacity:1,offset:.2},{transform:`translate(calc(-50% + ${(Math.random()-.5)*20}px),${-30-Math.random()*50}px) scale(1.1)`,opacity:0}],{duration:900+Math.random()*700,delay:i*70,easing:'ease-out',fill:'both'}),b)}}
async function drown(){
  if(busy)return;au();busy=true;un.getAnimations().forEach(a=>a.cancel());document.querySelectorAll('.fx').forEach(e=>e.remove());
  un.style.opacity=1;un.style.clipPath='none';place(START.r,START.c);
  const A=tc(START.r,START.c),W=tc(WATER_T.r,WATER_T.c);
  await wait(300);
  // 1) cae al agua en arco
  const DUR=480;const t0=performance.now();
  await new Promise(res=>{const f=now=>{const t=Math.min(1,(now-t0)/DUR),h=4*t*(1-t);un.style.left=(A.x+(W.x-A.x)*t)+'px';un.style.top=(A.y+8+(W.y-A.y)*t-90*h)+'px';un.style.zIndex=100+START.r+WATER_T.c;
    un.style.transform=`translate(-50%,-90%) rotate(${t*200*(1)}deg) scale(${1+h*.1})`;if(t<1)requestAnimationFrame(f);else res()};requestAnimationFrame(f)});
  const X=W.x,Y=W.y+8;
  // 2) CHAPUZÓN: salpicadura grande + doble onda
  sndSplash();
  drops(X,Y-10,16,1.5,500);ring(X,Y+2,true,40);setTimeout(()=>ring(X,Y+2,true,40),160);
  const sp=mk(X,Y-10,490,'width:120px;height:90px;background:radial-gradient(ellipse at 50% 100%,rgba(230,245,255,.95),rgba(190,225,255,.0) 70%);border-radius:50%');
  fin(sp.animate([{transform:'translate(-50%,-70%) scale(.3,.2)',opacity:1},{transform:'translate(-50%,-90%) scale(1,1.2)',opacity:.9,offset:.35},{transform:'translate(-50%,-110%) scale(1.2,1.4)',opacity:0}],{duration:520,fill:'both'}),sp);
  // 3) PATALEO: se hunde hasta la cintura (recorte por el agua) braceando y sacudiéndose como goma
  un.style.transform='translate(-50%,-90%)';
  const SINK=1500,t1=performance.now();let lastSplash=0;
  await new Promise(res=>{const f=now=>{const t=Math.min(1,(now-t1)/SINK);
    const sink=Math.pow(t,1.4)*62;               // px que se hunde
    const flail=Math.sin(now/55)*(1-t*.5);       // pataleo rápido
    const bob=Math.sin(now/170)*5*(1-t);         // sube y baja
    un.style.top=(Y+bob+sink)+'px';
    un.style.transform=`translate(-50%,-90%) rotate(${flail*14}deg) scale(${1+Math.sin(now/55+1)*.07*(1-t*.5)},${1-Math.sin(now/55+1)*.08*(1-t*.5)})`;
    // el agua tapa lo hundido: recorte del sprite por debajo de la línea de flotación
    const h=un.getBoundingClientRect().height/ (parseFloat(board.style.transform.replace(/[^\d.]/g,''))||1);
    un.style.clipPath=`inset(0 0 ${Math.max(0,(sink+14)/ (h||100)*100)}% 0)`;
    if(now-lastSplash>150&&t<.9){lastSplash=now;sndFlail();drops(X+(Math.random()-.5)*50,Y+6,3,.5,505);if(Math.random()<.55)ring(X+(Math.random()-.5)*40,Y+4,false,39)}
    if(t<1)requestAnimationFrame(f);else res()};requestAnimationFrame(f)});
  // 4) se va al fondo: burbujas, última onda y plop
  bubbles(X,Y,10,510);ring(X,Y+2,false,40);sndBubbles();
  un.animate([{opacity:1},{opacity:0}],{duration:280,fill:'forwards'});
  await wait(220);
  drops(X,Y,6,.8,505);ring(X,Y+2,true,40);sndPlop();
  await wait(1500);busy=false;
}
document.getElementById('go').onclick=drown;
</script></body></html>
